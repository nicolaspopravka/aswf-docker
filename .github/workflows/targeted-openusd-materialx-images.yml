name: Build targeted OpenUSD MaterialX images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cy2024-mtlx-1.38.10
            image_year: 2024
            usd: 24.08
            materialx: 1.38.10
          - name: cy2025-mtlx-1.39.3
            image_year: 2025
            usd: 25.05.01
            materialx: 1.39.3
          - name: cy2026-mtlx-1.39.4
            image_year: 2026
            usd: 26.03
            materialx: 1.39.4
          - name: cy2026-mtlx-1.39.3
            image_year: 2026
            usd: 26.03
            materialx: 1.39.3

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/local/julia* /usr/lib/jvm
          sudo apt-get clean
          docker system prune -af

      - name: Pull stock image
        env:
          STOCK_IMAGE: aswf/ci-vfxall:${{ matrix.image_year }}
        run: docker pull "$STOCK_IMAGE"

      - name: Build corrected packages inside stock image
        env:
          STOCK_IMAGE: aswf/ci-vfxall:${{ matrix.image_year }}
          ASWF_VFXPLATFORM_VERSION: ${{ matrix.image_year }}
          ASWF_OPENUSD_VERSION: ${{ matrix.usd }}
          ASWF_MATERIALX_VERSION: ${{ matrix.materialx }}
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/targeted-${{ matrix.name }}"
          docker run --rm \
            -e ASWF_VFXPLATFORM_VERSION \
            -e ASWF_OPENUSD_VERSION \
            -e ASWF_MATERIALX_VERSION \
            -e ASWF_BUILD_JOBS=4 \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -v "$RUNNER_TEMP/targeted-${{ matrix.name }}:/out" \
            -w /src "$STOCK_IMAGE" \
            bash /src/scripts/build_targeted_openusd_materialx.sh

      - name: Build and publish derived image
        env:
          STOCK_IMAGE: aswf/ci-vfxall:${{ matrix.image_year }}
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/aswf-ci-vfxall:${{ matrix.name }}-targeted-${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          image_root="$RUNNER_TEMP/targeted-${{ matrix.name }}"
          {
            echo "FROM ${STOCK_IMAGE}"
            # The stock image may already contain OIIO/OSL DSOs with the same
            # SONAMEs but a different ABI.  Remove those providers before the
            # targeted build's matching closure is layered in; otherwise the
            # dynamic loader can satisfy sdrOsl's DT_NEEDED entries with the
            # stale, already-loaded stock libraries.
            echo 'RUN find /usr/local/lib -maxdepth 1 -type f \( -name "libOpenImageIO*.so*" -o -name "libosl*.so*" -o -name "libOSL*.so*" \) -delete'
            echo "COPY root/ /usr/local/"
            echo 'ENV PXR_MTLX_STDLIB_SEARCH_PATHS=/usr/local/share/MaterialX/libraries'
            echo 'ENV LD_LIBRARY_PATH=/usr/local/lib'
            echo 'ENV PYTHONPATH=/usr/local/lib/python'
            echo 'RUN python3 -c '\''import ctypes; import pxr.Usd; ctypes.CDLL("/usr/local/plugin/usd/sdrOsl.so", mode=ctypes.RTLD_LOCAL); print("final-image sdrOsl dlopen succeeded")'\'''
          } > "$image_root/Dockerfile"
          docker build -t "$TARGET_IMAGE" "$image_root"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$TARGET_IMAGE"
          docker buildx imagetools inspect "$TARGET_IMAGE" | tee "$RUNNER_TEMP/${{ matrix.name }}-image.txt"
