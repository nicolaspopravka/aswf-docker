name: Build OpenUSD Moana debug image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: openusd-moana-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: openusd-26.03-ptex-safety-relwithdebinfo
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate immutable inputs
        run: bash scripts/matrix/validate_openusd_build_path_images.sh

      - name: Reclaim runner disk
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/local/julia* \
            /usr/lib/jvm
          sudo apt-get clean
          docker system prune -af
          df -h /

      - name: Prepare minimal build context
        env:
          CONTEXT: ${{ runner.temp }}/openusd-moana-debug
        run: |
          set -eux
          mkdir -p "$CONTEXT"
          cp scripts/matrix/Dockerfile.openusd-build-path "$CONTEXT/Dockerfile"
          cp scripts/matrix/build_openusd_path_image.sh "$CONTEXT/"
          cp scripts/matrix/run_moana_storm_debug.sh "$CONTEXT/"
          cp scripts/matrix/openusd-ptex-buffer-size-overflow.patch "$CONTEXT/"
          cp scripts/matrix/test_openusd_ptex_buffer_size.cpp "$CONTEXT/"
          cp scripts/matrix/validate_ptex_file.cpp "$CONTEXT/"
          cp scripts/vfx/build_usd.sh "$CONTEXT/aswf-build_usd.sh"

      - name: Build immutable debug image
        env:
          CONTEXT: ${{ runner.temp }}/openusd-moana-debug
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/openusd-moana-debug:openusd-26.03-ptex-safety-relwithdebinfo-${{ github.sha }}
          ASWF_SOURCE_COMMIT: 2c8484137a2f056a0abfd504dd5ad166240ab47e
        run: |
          set -euxo pipefail
          docker build --progress=plain \
            --tag "$TARGET_IMAGE" \
            --build-arg BASE_IMAGE="aswf/ci-common:6-clang19@sha256:4c0fd26c38fa9e848f500c3cd94edbd09183d82341b96b6285860ce57984b4c2" \
            --build-arg BUILD_PATH="pixar-build-usd" \
            --build-arg CY="2026" \
            --build-arg OPENUSD_VERSION="26.03" \
            --build-arg MATERIALX_VERSION="1.39.3" \
            --build-arg PYTHON_VERSION="3.13.14" \
            --build-arg PYTHON_SHA256="5ae535a36af0ebca6fca176ecb8197f5db9c1cb8c8f0cd12cdf1787046db1f41" \
            --build-arg SOURCE_REVISION="1818e14bae0036ac4bc7b4e60826b5797076a4fe" \
            --build-arg SOURCE_SHA256="590ea75ffa3ac0c35fdd080df04d61a696733b8f3d6a79bdc3f13f8077162d36" \
            --build-arg SCRIPT_SHA256="268cdd366edfcbf6e8759553c94aff8f1e6b92e484cb809591aaeb47b668f8a9" \
            --build-arg EXPECTED_GCC_MAJOR="14" \
            --build-arg INSTALL_PREFIX="/usr/local" \
            --build-arg BUILD_JOBS="4" \
            --build-arg ASWF_SOURCE_COMMIT="$ASWF_SOURCE_COMMIT" \
            --build-arg WORKFLOW_REVISION="$GITHUB_SHA" \
            --build-arg DEBUG_BUILD="1" \
            --build-arg PTEX_BUFFER_PATCH_SHA256="6865c0d3b26ad345bf6349b91f89cc2f0dabb79d120aef1219f175f16faeabf8" \
            "$CONTEXT" \
            2>&1 | tee "${{ runner.temp }}/openusd-moana-debug-docker-build.log"

      - name: Validate debug image
        env:
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/openusd-moana-debug:openusd-26.03-ptex-safety-relwithdebinfo-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker run --rm "$TARGET_IMAGE" \
            bash /opt/moana-debug/run_moana_storm_debug.sh self-test \
            | tee "${{ runner.temp }}/openusd-moana-debug-self-test.log"

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish and verify immutable image
        env:
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/openusd-moana-debug:openusd-26.03-ptex-safety-relwithdebinfo-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker push "$TARGET_IMAGE" \
            2>&1 | tee "${{ runner.temp }}/openusd-moana-debug-docker-push.log"
          docker image inspect "$TARGET_IMAGE" \
            > "${{ runner.temp }}/openusd-moana-debug-local-image.json"
          docker buildx imagetools inspect "$TARGET_IMAGE" \
            | tee "${{ runner.temp }}/openusd-moana-debug-remote-image.txt"
          digest="$(sed -n 's/^Digest:[[:space:]]*//p' \
            "${{ runner.temp }}/openusd-moana-debug-remote-image.txt" | head -1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s@%s\n' "$TARGET_IMAGE" "$digest" \
            > "${{ runner.temp }}/openusd-moana-debug-immutable-image.txt"

      - name: Extract embedded build evidence
        if: success()
        env:
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/openusd-moana-debug:openusd-26.03-ptex-safety-relwithdebinfo-${{ github.sha }}
          EVIDENCE: ${{ runner.temp }}/openusd-moana-debug-evidence
        run: |
          set -eux
          container="$(docker create "$TARGET_IMAGE")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$EVIDENCE"
          docker cp "$container:/opt/openusd-build-evidence/." "$EVIDENCE/"
          find "$EVIDENCE" -type f -print | sort

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openusd-moana-debug-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/openusd-moana-debug-docker-build.log
            ${{ runner.temp }}/openusd-moana-debug-self-test.log
            ${{ runner.temp }}/openusd-moana-debug-docker-push.log
            ${{ runner.temp }}/openusd-moana-debug-local-image.json
            ${{ runner.temp }}/openusd-moana-debug-remote-image.txt
            ${{ runner.temp }}/openusd-moana-debug-immutable-image.txt
            ${{ runner.temp }}/openusd-moana-debug-evidence
