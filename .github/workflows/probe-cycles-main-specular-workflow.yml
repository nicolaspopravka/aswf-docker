name: Probe Cycles main specular workflow

on:
  push:
    branches:
      - codex/diagnostics/cycles-main-specular-workflow

permissions:
  contents: read

concurrency:
  group: cycles-main-specular-workflow-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_IMAGE: ghcr.io/nicolaspopravka/usd-render-benchmark-cycles@sha256:5c1359c29c619c72afdcb39aab50b73c630f2dafa6e9a1fdc44d8b7bd9b30311
  CYCLES_REVISION: 6eee9e0c2b0d4c6fc3f7e09ca1c1add09351c556
  CYCLES_LIB_REVISION: ecbd06cf6d2a4aa6b00a61ffb479fc81b17aba08
  IMAGE_NAME: cycles-main-issue21

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate fixed inputs
        run: |
          set -euxo pipefail
          [[ "$BASE_IMAGE" == *@sha256:* ]]
          [[ "$CYCLES_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CYCLES_LIB_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test -f ci-cycles/Dockerfile.issue21-main
          test -f ci-cycles/build_cycles.sh
          test -f ci-cycles/issue21/cycles-material-input-warnings.patch
          test -f ci-cycles/issue21/cycles-issue21-metallic.usda
          test -f ci-cycles/issue21/cycles-issue21-specular.usda
          sha256sum ci-cycles/issue21/cycles-material-input-warnings.patch \
            ci-cycles/issue21/*.usda

      - name: Reclaim runner disk
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/local/julia* \
            /usr/lib/jvm
          sudo apt-get clean
          docker system prune -af
          df -h /

      - name: Build exact Cycles main delegate
        run: |
          set -euxo pipefail
          docker build --progress=plain \
            --file ci-cycles/Dockerfile.issue21-main \
            --tag "$IMAGE_NAME:$GITHUB_SHA" \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg CYCLES_REVISION="$CYCLES_REVISION" \
            --build-arg CYCLES_LIB_REVISION="$CYCLES_LIB_REVISION" \
            . 2>&1 | tee "${{ runner.temp }}/cycles-main-build.log"

      - name: Validate delegate and source identities
        run: |
          set -euxo pipefail
          evidence="${{ runner.temp }}/evidence"
          mkdir -p "$evidence"
          docker image inspect "$IMAGE_NAME:$GITHUB_SHA" \
            > "$evidence/image-inspect.json"
          docker run --rm \
            --volume "$evidence:/out" \
            "$IMAGE_NAME:$GITHUB_SHA" bash -c '
              set -euxo pipefail
              grep -q "Cycles tag: main" \
                /opt/cycles-build-evidence/source-revisions.txt
              grep -q "Cycles revision: '"$CYCLES_REVISION"'" \
                /opt/cycles-build-evidence/source-revisions.txt
              grep -q "Cycles Linux libraries revision: '"$CYCLES_LIB_REVISION"'" \
                /opt/cycles-build-evidence/source-revisions.txt
              python3 -c "from pxr import UsdImagingGL; names = [UsdImagingGL.Engine.GetRendererDisplayName(p) for p in UsdImagingGL.Engine.GetRendererPlugins()]; print(names); assert \"Cycles\" in names"
              ldd -r /opt/cycles/hydra/hdCycles.so | tee /out/hdCycles-ldd.txt
              ! grep -Eq "not found|undefined symbol" /out/hdCycles-ldd.txt
              cp /opt/cycles-build-evidence/source-revisions.txt /out/
              cp /opt/cycles-build-evidence/cycles-hdsi.patch /out/
            '

      - name: Run focused fixtures
        run: |
          set -euxo pipefail
          evidence="${{ runner.temp }}/evidence"
          set +e
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/ci-cycles/issue21:/test:ro" \
            --volume "$evidence:/out" \
            "$IMAGE_NAME:$GITHUB_SHA" bash -c '
              set -u
              export DISPLAY=:99
              export LIBGL_ALWAYS_SOFTWARE=1
              export GALLIUM_DRIVER=llvmpipe
              export CYCLES_DEVICE=CPU
              Xvfb :99 -screen 0 640x480x24 \
                +extension GLX +render -noreset >/out/xvfb.log 2>&1 &
              xvfb_pid=$!
              trap "kill $xvfb_pid 2>/dev/null || true" EXIT
              sleep 2
              glxinfo -B > /out/glxinfo.txt
              : > /out/statuses.txt
              for fixture in metallic specular; do
                usdrecord \
                  --renderer Cycles \
                  --camera /World/Camera \
                  --imageWidth 256 \
                  "/test/cycles-issue21-${fixture}.usda" \
                  "/out/Cycles-${fixture}.png" \
                  > "/out/Cycles-${fixture}.log" 2>&1
                printf "%s %s\\n" "$fixture" "$?" >> /out/statuses.txt
              done
            '
          render_status=$?
          set -e
          test "$render_status" -eq 0
          test "$(grep -h "USD input 'specularColor'.*maps to unavailable Cycles input 'specular'" \
            "$evidence"/Cycles-*.log | wc -l | tr -d ' ')" = 2
          test "$(grep -h "Unsupported USD input 'useSpecularWorkflow'.*value ignored" \
            "$evidence"/Cycles-*.log | wc -l | tr -d ' ')" = 2
          ! grep -h "Could not find parameter '\(specularColor\|useSpecularWorkflow\)'" \
            "$evidence"/Cycles-*.log
          test "$(grep -h 'Renderer plugin: HdCyclesPlugin' \
            "$evidence"/Cycles-*.log | wc -l | tr -d ' ')" = 2
          grep -qx 'metallic 0' "$evidence/statuses.txt"
          grep -qx 'specular 0' "$evidence/statuses.txt"
          sha256sum "$evidence"/Cycles-*.png > "$evidence/image-sha256.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cycles-main-specular-workflow-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/cycles-main-build.log
            ${{ runner.temp }}/evidence/
