name: OpenChessSet material discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: "2023"
            image: ghcr.io/nicolaspopravka/usd-render-benchmark@sha256:ec69f37fcd648a78e6697dadf0a4642366526caf3e9c48310f54f9e1987a2d7c
          - year: "2025"
            image: ghcr.io/nicolaspopravka/usd-render-benchmark@sha256:65d9529b1e746786e5a0ff4895042eeb5d64204f0a1f41372eb5b6f14215450f
          - year: "2024"
            image: ghcr.io/nicolaspopravka/usd-render-benchmark@sha256:345d74f8da53f9db8a582981dbdfeb6f2775a0f5035468f67c0ac8b920d0d0fc
    name: Discovery CY${{ matrix.year }}

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Checkout pinned benchmark asset
        uses: actions/checkout@v4
        with:
          repository: usd-wg/assets
          ref: 907d5f17bbe933fc14441a3f3ab69a5bd8abe32a
          path: benchmark-assets
          sparse-checkout: full_assets/OpenChessSet

      - name: Free runner disk space
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean
          docker system prune -af
          df -h

      - name: Compare default and explicit MaterialX library discovery
        run: |
          set -euxo pipefail
          mkdir -p "${RUNNER_TEMP}/issue10-${{ matrix.year }}"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/.github/workflows/scripts:/probe:ro" \
            --volume "${GITHUB_WORKSPACE}/benchmark-assets/full_assets/OpenChessSet:/asset:ro" \
            --volume "${RUNNER_TEMP}/issue10-${{ matrix.year }}:/out" \
            --entrypoint bash \
            "${{ matrix.image }}" \
            /probe/issue10_discovery.sh /out

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue10-openchessset-${{ matrix.year }}
          path: "${{ runner.temp }}/issue10-${{ matrix.year }}/"
          if-no-files-found: error
