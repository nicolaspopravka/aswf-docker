name: Issue 10 refreshed OpenChessSet validation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ci/openchessset-issue10

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: "2024"
            renderer: GL
            image: aswf/ci-vfxall:2024-clang17.9@sha256:e7431ef50a2e07bd53af515f54cb07f5601b1870046fa81e2d57a6b433e49fb6
          - year: "2027"
            renderer: Storm
            image: aswf/ci-vfxall:2027-clang22.1@sha256:d41fc294f7770c4390de0813c4594dcd03ba99dcf1da1dc5be85f04acffa1b3d
    name: OpenChessSet CY${{ matrix.year }}

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Checkout pinned benchmark asset
        uses: actions/checkout@v4
        with:
          repository: usd-wg/assets
          ref: 907d5f17bbe933fc14441a3f3ab69a5bd8abe32a
          path: benchmark-assets
          sparse-checkout: full_assets/OpenChessSet

      - name: Free runner disk space
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean
          docker system prune -af
          df -h

      - name: Compare default and explicit MaterialX library discovery
        run: |
          set -euxo pipefail
          mkdir -p "${RUNNER_TEMP}/issue10-${{ matrix.year }}"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/.github/workflows/scripts:/probe:ro" \
            --volume "${GITHUB_WORKSPACE}/benchmark-assets/full_assets/OpenChessSet:/asset:ro" \
            --volume "${RUNNER_TEMP}/issue10-${{ matrix.year }}:/out" \
            --entrypoint bash \
            "${{ matrix.image }}" \
            /probe/issue10_long_render.sh /out "${{ matrix.renderer }}" "${{ matrix.year }}"

      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue10-openchessset-${{ matrix.year }}
          path: "${{ runner.temp }}/issue10-${{ matrix.year }}/"
          if-no-files-found: error
