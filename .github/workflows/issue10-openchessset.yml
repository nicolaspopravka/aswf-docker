name: OpenChessSet material discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - year: "2023"
            image: ghcr.io/nicolaspopravka/usd-render-benchmark@sha256:bf9e13c9db8293b2e1c9ebd51454fc836452b34209a2f86ce2492e04bda6a1ac
          - year: "2025"
            image: ghcr.io/nicolaspopravka/usd-render-benchmark@sha256:18f7106f3334612e3e3d4462befac594ed7d0f3272ca18f7a5692ba9c9e0dbe4
          - year: "2024"
            image: ghcr.io/nicolaspopravka/usd-render-benchmark@sha256:92eaa5402c3978072c874cf9ed8056217505ceca11ccd1d58b6ac98acfc6cfbb
    name: Discovery CY${{ matrix.year }}

    steps:
      - name: Checkout workflow
        uses: actions/checkout@v4

      - name: Checkout pinned benchmark asset
        uses: actions/checkout@v4
        with:
          repository: usd-wg/assets
          ref: 907d5f17bbe933fc14441a3f3ab69a5bd8abe32a
          path: benchmark-assets
          sparse-checkout: full_assets/OpenChessSet

      - name: Compare default and explicit MaterialX library discovery
        run: |
          set -euxo pipefail
          mkdir -p "${RUNNER_TEMP}/issue10-${{ matrix.year }}"
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}/.github/workflows/scripts:/probe:ro" \
            --volume "${GITHUB_WORKSPACE}/benchmark-assets/full_assets/OpenChessSet:/asset:ro" \
            --volume "${RUNNER_TEMP}/issue10-${{ matrix.year }}:/out" \
            --entrypoint bash \
            "${{ matrix.image }}" \
            /probe/issue10_discovery.sh /out

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue10-openchessset-${{ matrix.year }}
          path: "${{ runner.temp }}/issue10-${{ matrix.year }}/"
          if-no-files-found: error
