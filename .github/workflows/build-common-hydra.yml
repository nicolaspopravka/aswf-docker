name: Build Common Hydra Stack

on:
  workflow_dispatch: {}
  push:
    branches:
      - opencode/common-hydra-image
    paths:
      - ci-common-hydra/**
      - .github/workflows/build-common-hydra.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: common-hydra-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_IMAGE: ghcr.io/nicolaspopravka/openmoonray-hydra@sha256:75945fa61e05ee39c46d9f82c6e2add7759ac242568f5a51127d76170e1661fc
  IMAGE_NAME: ghcr.io/nicolaspopravka/usd-common-hydra
  CYCLES_TAG: v5.0.0
  CYCLES_REVISION: 2eba4102417439e59e03003f1dff881192cbd75f
  CYCLES_LIB_REVISION: 3abcca1aa43fe29f21cdf442d0cf412357cf4d25
  OPENUSD_VERSION_PREFIX: "25.05"
  OPENUSD_TAG: v25.05.01
  OPENUSD_REVISION: 1595c62ea8381b5b22eb8621afc8652f89b6136d
  EMBREE_TAG: v3.13.2
  EMBREE_REVISION: d7157470e089098b9c7323f608835ed50453e606
  EMBREE_TARBALL_SHA256: dcda827e5b7a606c29d00c1339f1ef00f7fa6867346bc46a2318e8f0a601c6f9

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve pinned tags
        run: |
          set -euxo pipefail
          {
            printf 'IMMUTABLE_TAG=usd%s-cycles%s-embree%s-%s\n' \
              "$OPENUSD_VERSION_PREFIX" "${CYCLES_TAG#v}" "${EMBREE_TAG#v}" "$GITHUB_SHA"
            printf 'VARIANT_TAG=usd%s-cycles%s-embree%s\n' \
              "$OPENUSD_VERSION_PREFIX" "${CYCLES_TAG#v}" "${EMBREE_TAG#v}"
          } >> "$GITHUB_ENV"

      - name: Reclaim runner disk
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/local/julia* \
            /usr/lib/jvm
          sudo apt-get clean
          docker system prune -af
          df -h /

      - name: Validate immutable inputs
        run: |
          set -eux
          [[ "$BASE_IMAGE" == *@sha256:* ]]
          [[ "$CYCLES_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CYCLES_LIB_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPENUSD_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EMBREE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EMBREE_TARBALL_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$IMAGE_NAME" == "${IMAGE_NAME,,}" ]]
          test -f ci-common-hydra/Dockerfile
          test -f ci-common-hydra/build_cycles_dependencies.sh
          test -f ci-common-hydra/build_cycles_common.sh
          test -f ci-common-hydra/common-hydra-env
          test -f ci-cycles-historical/import_openusd_dependencies.cmake
          test -f ci-cycles/check_png_variation.py
          test -f ci-embree/build_embree.sh
          test -f ci-embree/build_hdembree.sh
          test -f ci-embree/validate_image.sh
          test -f ci-embree/enumerate_plugins.py
          test -f ci-embree/hdembree-consumer/CMakeLists.txt
          test -f ci-embree/hdembree-consumer/plugInfo-root.json

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build common-stack image
        run: |
          set -euxo pipefail
          docker build --progress=plain \
            --file ci-common-hydra/Dockerfile \
            --target runtime \
            --tag "$IMAGE_NAME:$IMMUTABLE_TAG" \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg ASWF_SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg WORKFLOW_REVISION="$GITHUB_SHA" \
            --build-arg CYCLES_TAG="$CYCLES_TAG" \
            --build-arg CYCLES_REVISION="$CYCLES_REVISION" \
            --build-arg CYCLES_LIB_REVISION="$CYCLES_LIB_REVISION" \
            --build-arg OPENUSD_TAG="$OPENUSD_TAG" \
            --build-arg OPENUSD_REVISION="$OPENUSD_REVISION" \
            --build-arg EMBREE_TAG="$EMBREE_TAG" \
            --build-arg EMBREE_REVISION="$EMBREE_REVISION" \
            --build-arg EMBREE_TARBALL_SHA256="$EMBREE_TARBALL_SHA256" \
            . 2>&1 | tee "${{ runner.temp }}/common-hydra-docker-build.log"

      - name: Validate image closure
        run: |
          set -euxo pipefail
          docker run --rm \
            --env OPENUSD_VERSION_PREFIX \
            "$IMAGE_NAME:$IMMUTABLE_TAG" bash -c '
              set -euxo pipefail
              test -x /usr/local/bin/usdrecord
              test -x /opt/cycles/cycles
              test -f /opt/cycles/hydra/hdCycles.so
              test -f /opt/cycles/hydra/plugInfo.json
              test -d /opt/MoonRay/installs/openmoonray/plugin/pxr
              test -f /usr/local/bin/common-hydra-env
              PYTHONPATH=/usr/local/lib/python python3 -c "from pxr import Usd; v = Usd.GetVersion(); t = tuple(v) if isinstance(v, (tuple, list)) else tuple(int(p) for p in str(v).split(\".\")[:3]); print(\"OpenUSD version:\", v); assert t[0] == 25 or (t[0] == 0 and t[1] == 25), t"
              LD_LIBRARY_PATH="/opt/cycles/lib:/opt/cycles-dependencies/tbb/lib:/usr/local/lib:/usr/local/lib64" \
                ldd -r /opt/cycles/hydra/hdCycles.so | tee /tmp/hdCycles-ldd.txt
              ! grep -Eq "not found|undefined symbol" /tmp/hdCycles-ldd.txt
              grep -q "libtbb.so.12" /tmp/hdCycles-ldd.txt
              ! grep -q "libtbb.so.2 " /tmp/hdCycles-ldd.txt
            ' | tee "${{ runner.temp }}/common-hydra-image-validation.log"

      - name: Validate neutral default enumerates Storm only
        run: |
          set -euxo pipefail
          docker run --rm \
            "$IMAGE_NAME:$IMMUTABLE_TAG" bash -c '
              set -euxo pipefail
              eval "$(common-hydra-env usd)"
              python3 -c "from pxr import Usd, UsdImagingGL; plugins = UsdImagingGL.Engine.GetRendererPlugins(); names = [UsdImagingGL.Engine.GetRendererDisplayName(p) for p in plugins]; print(list(zip(plugins, names))); assert \"Storm\" in names; assert \"Cycles\" not in names; assert not any(n.startswith(\"Moonray\") for n in names)"
            ' | tee "${{ runner.temp }}/common-hydra-enum-neutral.log"

      - name: Validate Cycles environment enumerates Cycles
        run: |
          set -euxo pipefail
          docker run --rm \
            "$IMAGE_NAME:$IMMUTABLE_TAG" bash -c '
              set -euxo pipefail
              eval "$(common-hydra-env cycles)"
              python3 -c "from pxr import Usd, UsdImagingGL; plugins = UsdImagingGL.Engine.GetRendererPlugins(); names = [UsdImagingGL.Engine.GetRendererDisplayName(p) for p in plugins]; print(list(zip(plugins, names))); assert \"Cycles\" in names"
            ' | tee "${{ runner.temp }}/common-hydra-enum-cycles.log"

      - name: Validate MoonRay environment enumerates MoonRay
        run: |
          set -euxo pipefail
          docker run --rm \
            "$IMAGE_NAME:$IMMUTABLE_TAG" bash -c '
              set -euxo pipefail
              eval "$(common-hydra-env moonray)"
              python3 -c "from pxr import Usd, UsdImagingGL; plugins = UsdImagingGL.Engine.GetRendererPlugins(); names = [UsdImagingGL.Engine.GetRendererDisplayName(p) for p in plugins]; print(list(zip(plugins, names))); assert \"Moonray\" in names; assert \"Moonray (debug)\" in names"
            ' | tee "${{ runner.temp }}/common-hydra-enum-moonray.log"

      - name: Validate Embree delegate closure
        run: |
          set -euxo pipefail
          docker run -i --rm \
            "$IMAGE_NAME:$IMMUTABLE_TAG" bash -s -- "${OPENUSD_VERSION_PREFIX%%.*}" \
            < ci-embree/validate_image.sh \
            2>&1 | tee "${{ runner.temp }}/common-hydra-embree-validation.log"

      - name: Validate Embree environment enumerates Embree
        run: |
          set -euxo pipefail
          docker run --rm \
            "$IMAGE_NAME:$IMMUTABLE_TAG" bash -c '
              set -euxo pipefail
              eval "$(common-hydra-env embree)"
              python3 -c "from pxr import Usd, UsdImagingGL; plugins = UsdImagingGL.Engine.GetRendererPlugins(); names = [UsdImagingGL.Engine.GetRendererDisplayName(p) for p in plugins]; print(list(zip(plugins, names))); assert \"Embree\" in names; assert \"Storm\" in names"
            ' | tee "${{ runner.temp }}/common-hydra-enum-embree.log"

      - name: Export stack evidence
        run: |
          set -euxo pipefail
          evidence_root="${{ runner.temp }}/common-stack-evidence"
          mkdir -p "$evidence_root"
          container_id="$(docker create "$IMAGE_NAME:$IMMUTABLE_TAG")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/opt/cycles-build-evidence" \
            "$evidence_root/cycles-build-evidence"
          docker cp "$container_id:/opt/cycles-dependency-evidence" \
            "$evidence_root/cycles-dependency-evidence"
          docker cp "$container_id:/opt/embree-build-evidence" \
            "$evidence_root/embree-build-evidence"
          docker cp "$container_id:/opt/hdembree-build-evidence" \
            "$evidence_root/hdembree-build-evidence"
          docker image inspect "$IMAGE_NAME:$IMMUTABLE_TAG" \
            > "$evidence_root/image-inspect.json"
          {
            printf 'Base image: %s\n' "$BASE_IMAGE"
            printf 'Cycles tag: %s\n' "$CYCLES_TAG"
            printf 'Cycles revision: %s\n' "$CYCLES_REVISION"
            printf 'Cycles Linux libraries revision: %s\n' "$CYCLES_LIB_REVISION"
            printf 'OpenUSD tag: %s\n' "$OPENUSD_TAG"
            printf 'OpenUSD revision: %s\n' "$OPENUSD_REVISION"
            printf 'Embree tag: %s\n' "$EMBREE_TAG"
            printf 'Embree revision: %s\n' "$EMBREE_REVISION"
            printf 'Embree tarball sha256: %s\n' "$EMBREE_TARBALL_SHA256"
            printf 'OpenUSD version prefix: %s\n' "$OPENUSD_VERSION_PREFIX"
          } > "$evidence_root/stack-source-revisions.txt"

      - name: Publish validated image
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euxo pipefail
          docker push "$IMAGE_NAME:$IMMUTABLE_TAG" \
            2>&1 | tee "${{ runner.temp }}/common-push-immutable.log"
          docker tag "$IMAGE_NAME:$IMMUTABLE_TAG" "$IMAGE_NAME:$VARIANT_TAG"
          docker push "$IMAGE_NAME:$VARIANT_TAG" \
            2>&1 | tee "${{ runner.temp }}/common-push-version.log"

          docker buildx imagetools inspect "$IMAGE_NAME:$IMMUTABLE_TAG" \
            | tee "${{ runner.temp }}/common-remote-immutable.txt"
          docker buildx imagetools inspect "$IMAGE_NAME:$VARIANT_TAG" \
            | tee "${{ runner.temp }}/common-remote-version.txt"

          immutable_digest="$(sed -n 's/^Digest:[[:space:]]*//p' \
            "${{ runner.temp }}/common-remote-immutable.txt" | head -1)"
          version_digest="$(sed -n 's/^Digest:[[:space:]]*//p' \
            "${{ runner.temp }}/common-remote-version.txt" | head -1)"
          [[ "$immutable_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$immutable_digest" = "$version_digest"
          printf '%s@%s\n' "$IMAGE_NAME" "$immutable_digest" \
            | tee "${{ runner.temp }}/common-image-ref.txt"

      - name: Verify anonymous public access
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euxo pipefail
          docker logout ghcr.io
          docker buildx imagetools inspect "$IMAGE_NAME:$IMMUTABLE_TAG" \
            | tee "${{ runner.temp }}/common-anonymous-inspect.txt"
          grep -q '^Digest:[[:space:]]*sha256:' \
            "${{ runner.temp }}/common-anonymous-inspect.txt"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: common-hydra-build-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/common-hydra-docker-build.log
            ${{ runner.temp }}/common-hydra-image-validation.log
            ${{ runner.temp }}/common-hydra-enum-*.log
            ${{ runner.temp }}/common-stack-evidence/
            ${{ runner.temp }}/common-push-*.log
            ${{ runner.temp }}/common-remote-*.txt
            ${{ runner.temp }}/common-image-ref.txt
            ${{ runner.temp }}/common-anonymous-inspect.txt
