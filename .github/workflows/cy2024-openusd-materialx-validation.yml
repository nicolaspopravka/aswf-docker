name: CY2024 OpenUSD MaterialX validation

on:
  workflow_dispatch:
    inputs:
      materialx_stdlib_path_mode:
        description: MaterialX stdlib path variant to test
        required: true
        default: both
        type: choice
        options:
          - parent
          - libraries
          - both
      ld_preload:
        description: Colon-separated preload libraries for the controlled A/B
        required: true
        default: /usr/local/lib/libOpenImageIO_Util.so:/usr/local/lib/liboslquery.so
        type: string
      include_openchessset:
        description: Include the optional, potentially slow OpenChessSet software-GL render
        required: true
        default: false
        type: boolean
      render_context:
        description: Headless graphics context used by the render gate
        required: true
        default: egl-noqt
        type: choice
        options:
          - egl-noqt
          - stock-xvfb
      openchessset_timeout:
        description: OpenChessSet timeout in seconds when included
        required: true
        default: '300'
        type: string

jobs:
  validation:
    if: github.repository_owner != 'AcademySoftwareFoundation'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run CY2024 path comparison
        env:
          DIAGNOSTIC_MTLX_STDLIB_PATH_MODE: ${{ inputs.materialx_stdlib_path_mode }}
          DIAGNOSTIC_LD_PRELOAD: ${{ inputs.ld_preload }}
          DIAGNOSTIC_INCLUDE_OPENCHESSSET: ${{ inputs.include_openchessset && '1' || '0' }}
          DIAGNOSTIC_OPENCHESSSET_REQUIRED: '0'
          DIAGNOSTIC_OPENCHESSSET_TIMEOUT: ${{ inputs.openchessset_timeout }}
          DIAGNOSTIC_RENDER_CONTEXT: ${{ inputs.render_context }}
        run: |
          set -o pipefail
          mkdir -p diagnostic-artifacts/metadata
          docker pull aswf/ci-vfxall:2024
          docker image inspect aswf/ci-vfxall:2024 \
            --format '{{index .RepoDigests 0}}' \
            > diagnostic-artifacts/metadata/base-image-digest.txt
          docker run --rm \
            -e DIAGNOSTIC_MTLX_STDLIB_PATH_MODE \
            -e DIAGNOSTIC_LD_PRELOAD \
            -e DIAGNOSTIC_INCLUDE_OPENCHESSSET \
            -e DIAGNOSTIC_OPENCHESSSET_REQUIRED \
            -e DIAGNOSTIC_OPENCHESSSET_TIMEOUT \
            -e DIAGNOSTIC_RENDER_CONTEXT \
            -e CY2024_IMAGE=aswf/ci-vfxall:2024 \
            -e CY2024_IMAGE_DIGEST \
            -v "${PWD}:/src:ro" \
            -v "${PWD}/diagnostic-artifacts:/evidence" \
            -w /src \
            aswf/ci-vfxall:2024 \
            scripts/tests/cy2024_openusd_materialx_validation.sh /evidence \
            2>&1 | tee diagnostic-artifacts/driver.log
      - name: Upload CY2024 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cy2024-openusd-materialx-${{ github.run_id }}
          path: diagnostic-artifacts
          if-no-files-found: warn
          retention-days: 14
