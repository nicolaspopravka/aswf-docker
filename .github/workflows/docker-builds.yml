name: Test Build Docker Images

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ${{ (github.repository_owner == 'AcademySoftwareFoundation' && 'ubuntu-22.04-8c-32g-300h') || 'ubuntu-latest' }}
    env:
      DOCKER_CLI_EXPERIMENTAL: enabled
      DOCKER_BUILDKIT: '1'

    strategy:
      # Don't let a failure for one year affect the others
      fail-fast: false
      matrix:
        include:
          - group: vfx-2024
            name: vfx-2024
            common_version: 4-clang16
            common_version_noclang: 4
            version: 2024-clang16
            version_noclang: 2024
            test: ""
          - group: vfx-2026
            name: vfx-2026
            common_version: 6-clang20
            common_version_noclang: 6
            version: 2026-clang20
            version_noclang: 2026
            test: ""

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Activate Docker buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      with:
        # Use the docker driver so locally built images (e.g. ci-baseos-gl-conan) are
        # visible to subsequent buildx steps via the shared Docker daemon image store,
        # consistent with local development behaviour. The docker-container driver
        # (the default) runs BuildKit in an isolated container with its own image store,
        # causing subsequent steps to pull base images from Docker Hub instead of reusing
        # locally built ones.
        driver: docker
      env:
        BUILDKIT_STEP_LOG_MAX_SIZE: 10485760

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        enable-cache: auto

    - name: Set up Python
      run: uv python install 3.10

    - name: Install aswfdocker and dependencies
      run: uv sync --frozen

    - name: Free up disk space
      run: |
        df -h
        sudo apt-get remove -y '^llvm-.*' '^php.*' '^php8.*' '^cpp.*' '^g\+\+.*' '^clang.*' '^gfortran.*' \
            '^dotnet-.*' '^libmono-.*' '^mono-.*' monodoc-http '^r-.*' '^ruby.*' \
            ant ant-optional aria2 azure-cli firefox google-chrome-stable microsoft-edge-stable powershell \
            imagemagick '^imagemagick-.*' '^libmagickcore-.*' '^libmagickwand-.*'  kubectl mercurial mercurial-common subversion
        sudo apt-get autoremove -y
        sudo apt-get clean
        sudo rm -rf \
            /usr/share/dotnet/ \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /usr/local/julia* \
            /usr/lib/jvm || true
        sudo docker system prune -a
        df -h
        dpkg -l 

    - name: Build Conan Builder Image
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type IMAGE \
          --group baseos-gl-conan \
          --version ${{ matrix.common_version_noclang }} \
          --push NO

    - name: Build common wrappers
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group common-wrappers \
          --version ${{ matrix.common_version_noclang }} \
          --build-missing \
          --push NO

    - name: Build Ninja and CMake
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group common-1 \
          --version ${{ matrix.common_version_noclang }} \
          --build-missing \
          --push NO

    - name: Build Clang
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group common-2 \
          --version ${{ matrix.common_version }} \
          --build-missing \
          --push NO

    - name: Build ci-common Docker Image for downstream images
      run: |
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type IMAGE \
          --group common \
          --version ${{ matrix.common_version }}\
          --push NO

    - name: Build base1 system wrapper packages
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group base1-wrappers \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build base1 level 1 packages
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group base1-1 \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build base1 level 2 packages
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group base1-2 \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build base1 level 3 packages
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group base1-3 \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build base2 system wrapper packages for ci-baseqt image
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group base2-wrappers \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build base2 system packages for ci-baseqt image
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group base2-1 \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build base2 level 2 packages (Qt) for ci-baseqt image
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group base2-2 \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build base3 packages (PySide) for base image
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group base3 \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build base and baseqt images
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type IMAGE \
          --group base \
          --version ${{ matrix.version }} \
          --push NO

    - name: Build vfx1 system wrapper packages
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group vfx1-wrappers \ 
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build vfx1 level 1 packages
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group vfx1-1 \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build vfx1 level 2 packages
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group vfx1-2 \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build vfx1 level 3 packages
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group vfx1-3 \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build vfx1 level 4 packages
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group vfx1-4 \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build vfx1 level 5 packages
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group vfx1-5 \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build vfx1 level 6 packages
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group vfx1-6 \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build vfx1 level 7 packages
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type PACKAGE \
          --group vfx1-7 \
          --version ${{ matrix.version_noclang }} \
          --build-missing \
          --push NO

    - name: Build vfx1 / vfx2 images   
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type IMAGE \
          --group vfx1 \
          --group vfx2 \
          --version ${{ matrix.version_noclang }} \
          --push NO

    - name: Build vfx3 images
      run: |
        set -ex
        uv run aswfdocker \
          --verbose \
          build \
          --ci-image-type IMAGE \
          --group vfx3 \
          --version ${{ matrix.version }} \
          --push NO

    - run: |
        set -ex
        export DOCKER_ORG=`uv run aswfdocker --repo-uri $GITHUB_REPOSITORY --source-branch $GITHUB_REF getdockerorg`
        test_script=scripts/tests/${{ matrix.version }}/test_${{ matrix.test }}.sh
        if [ -f $test_script ]
        then
          echo "Going to run ${test_script}"
          echo "docker run -i --rm ${DOCKER_ORG}/ci-${{ matrix.test }}:${{ matrix.version }} run < ${test_script}"
          docker run -i --rm \
            -v $(Pipeline.Workspace)/cache/ci-image_${{ matrix.name }}_${{ matrix.version }}/ccache:/tmp/ccache \
            ${DOCKER_ORG}/ci-${{ matrix.test }}:${{ matrix.version }} run < ${test_script}
        else
          echo "No test script found $test_script"
        fi
      name: Run test script ${{ matrix.version }}/test_${{ matrix.test }}.sh to check Docker image
      if: ${{ matrix.test != '' }}

    - name: Log in to GitHub Container Registry
      run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish fixed VFX-all image to GHCR
      env:
        SOURCE_IMAGE: docker.io/aswftesting/ci-vfxall:${{ matrix.version_noclang }}
        TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/aswf-ci-vfxall:${{ matrix.version_noclang }}-openusd-fix-${{ github.sha }}
      run: |
        set -eux
        docker image inspect "$SOURCE_IMAGE"
        docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
        docker push "$TARGET_IMAGE"
        docker buildx imagetools inspect "$TARGET_IMAGE" | tee "ghcr-${{ matrix.version_noclang }}-image.txt"
