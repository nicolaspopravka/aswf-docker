name: Build Cycles Hydra Delegate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cycles-hydra-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_IMAGE: aswf/ci-baseqt:2026@sha256:47804083985e25cecbbb6988be2c1933195bd96bb3c41b0db96f07ae8815ca69
  CYCLES_TAG: v5.2.0
  CYCLES_REVISION: 3b97e190c5ff1a2ed2160d879ad5bf95bea7b8ba
  CYCLES_LIB_REVISION: 30d9f881c4b62c52323fd11637eeea56d460e35c
  OPENUSD_TAG: v26.03
  OPENUSD_REVISION: 1818e14bae0036ac4bc7b4e60826b5797076a4fe
  CI_IMAGE_NAME: ghcr.io/nicolaspopravka/ci-cycles
  CI_VERSION_TAG: cycles-libs-5.2-openusd-26.03-cy2026
  IMAGE_NAME: ghcr.io/nicolaspopravka/usd-render-benchmark-cycles
  VERSION_TAG: cycles-5.2.0-openusd-26.03-cy2026

jobs:
  build:
    name: cycles-5.2.0-openusd-26.03-cy2026
    runs-on: ubuntu-22.04
    timeout-minutes: 330

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Reclaim runner disk
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/local/julia* \
            /usr/lib/jvm
          sudo apt-get clean
          docker system prune -af
          df -h /

      - name: Validate immutable inputs
        run: |
          set -eux
          [[ "$BASE_IMAGE" == *@sha256:* ]]
          [[ "$CYCLES_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CYCLES_LIB_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPENUSD_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CI_IMAGE_NAME" == "${CI_IMAGE_NAME,,}" ]]
          [[ "$IMAGE_NAME" == "${IMAGE_NAME,,}" ]]
          test -f ci-cycles/Dockerfile.dependencies
          test -f ci-cycles/Dockerfile
          test -f ci-cycles/build_dependencies.sh
          test -f ci-cycles/build_cycles.sh
          test -f ci-cycles/smoke.usda
          test -f ci-cycles/check_png_variation.py

      - name: Build immutable dependency image
        env:
          CI_IMMUTABLE_TAG: ${{ env.CI_VERSION_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker build --progress=plain \
            --file ci-cycles/Dockerfile.dependencies \
            --tag "$CI_IMAGE_NAME:$CI_IMMUTABLE_TAG" \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg WORKFLOW_REVISION="$GITHUB_SHA" \
            --build-arg CYCLES_LIB_REVISION="$CYCLES_LIB_REVISION" \
            --build-arg OPENUSD_TAG="$OPENUSD_TAG" \
            --build-arg OPENUSD_REVISION="$OPENUSD_REVISION" \
            . 2>&1 | tee "${{ runner.temp }}/ci-cycles-docker-build.log"

      - name: Validate dependency image boundary
        env:
          CI_IMMUTABLE_TAG: ${{ env.CI_VERSION_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker run --rm \
            --env CYCLES_LIB_REVISION \
            "$CI_IMAGE_NAME:$CI_IMMUTABLE_TAG" bash -c '
            set -euxo pipefail
            test -x /opt/usd/bin/usdrecord
            test -d /opt/cycles-dependencies
            test -d /opt/cycles-dependencies/.git
            python3 -c "import PySide6; print(PySide6.__version__)"
            test "$(git -C /opt/cycles-dependencies rev-parse HEAD)" = \
              "$CYCLES_LIB_REVISION"
            test ! -e /opt/cycles
            test ! -e /opt/cycles-dependencies/hydra/hdCycles.so
          ' | tee "${{ runner.temp }}/ci-cycles-image-validation.log"

      - name: Build immutable delegate image
        env:
          CI_IMMUTABLE_TAG: ${{ env.CI_VERSION_TAG }}-${{ github.sha }}
          IMMUTABLE_TAG: ${{ env.VERSION_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker build --progress=plain \
            --file ci-cycles/Dockerfile \
            --tag "$IMAGE_NAME:$IMMUTABLE_TAG" \
            --build-arg DEPENDENCY_IMAGE="$CI_IMAGE_NAME:$CI_IMMUTABLE_TAG" \
            --build-arg ASWF_SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg WORKFLOW_REVISION="$GITHUB_SHA" \
            --build-arg CYCLES_TAG="$CYCLES_TAG" \
            --build-arg CYCLES_REVISION="$CYCLES_REVISION" \
            --build-arg CYCLES_LIB_REVISION="$CYCLES_LIB_REVISION" \
            --build-arg OPENUSD_TAG="$OPENUSD_TAG" \
            --build-arg OPENUSD_REVISION="$OPENUSD_REVISION" \
            . 2>&1 | tee "${{ runner.temp }}/cycles-docker-build.log"

      - name: Validate delegate and dependency closure
        env:
          IMMUTABLE_TAG: ${{ env.VERSION_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker run --rm "$IMAGE_NAME:$IMMUTABLE_TAG" bash -c '
            set -euxo pipefail
            test -x /opt/usd/bin/usdrecord
            test -f /opt/cycles/hydra/hdCycles.so
            python3 -c "from pxr import Usd, UsdImagingGL; print(Usd.GetVersion()); plugins = UsdImagingGL.Engine.GetRendererPlugins(); names = [UsdImagingGL.Engine.GetRendererDisplayName(p) for p in plugins]; print(list(zip(plugins, names))); assert \"Cycles\" in names"
            ldd /opt/cycles/hydra/hdCycles.so | tee /tmp/hdCycles-ldd.txt
            ! grep -q "not found" /tmp/hdCycles-ldd.txt
            grep -q "libtbb.so.12" /tmp/hdCycles-ldd.txt
            ! grep -q "libtbb.so.2 " /tmp/hdCycles-ldd.txt
          ' | tee "${{ runner.temp }}/cycles-image-validation.log"

      - name: Run stock usdrecord Hydra-GPU-disabled smoke
        env:
          IMMUTABLE_TAG: ${{ env.VERSION_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          mkdir -p "${{ runner.temp }}/cycles-smoke"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/ci-cycles:/test:ro" \
            --volume "${{ runner.temp }}/cycles-smoke:/out" \
            "$IMAGE_NAME:$IMMUTABLE_TAG" \
            bash -c '
              set -euxo pipefail
              xvfb-run -a usdrecord \
                --disableGpu \
                --renderer Cycles \
                --camera /World/Camera \
                --imageWidth 128 \
                /test/smoke.usda \
                /out/cycles-smoke.png
              python3 /test/check_png_variation.py /out/cycles-smoke.png
            ' | tee "${{ runner.temp }}/cycles-smoke.log"
          sha256sum "${{ runner.temp }}/cycles-smoke/cycles-smoke.png" \
            | tee "${{ runner.temp }}/cycles-disabled-gpu-smoke.sha256"

      - name: Run benchmark-semantics usdrecord smoke
        env:
          IMMUTABLE_TAG: ${{ env.VERSION_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/ci-cycles:/test:ro" \
            --volume "${{ runner.temp }}/cycles-smoke:/out" \
            "$IMAGE_NAME:$IMMUTABLE_TAG" \
            bash -c '
              set -euxo pipefail
              xvfb-run -a usdrecord \
                --renderer Cycles \
                --camera /World/Camera \
                --imageWidth 128 \
                /test/smoke.usda \
                /out/cycles-gpu-enabled-smoke.png
              python3 /test/check_png_variation.py \
                /out/cycles-gpu-enabled-smoke.png
            ' | tee "${{ runner.temp }}/cycles-gpu-enabled-smoke.log"
          sha256sum \
            "${{ runner.temp }}/cycles-smoke/cycles-gpu-enabled-smoke.png" \
            | tee "${{ runner.temp }}/cycles-gpu-enabled-smoke.sha256"

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish validated images
        env:
          CI_IMMUTABLE_TAG: ${{ env.CI_VERSION_TAG }}-${{ github.sha }}
          IMMUTABLE_TAG: ${{ env.VERSION_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker tag "$CI_IMAGE_NAME:$CI_IMMUTABLE_TAG" \
            "$CI_IMAGE_NAME:$CI_VERSION_TAG"
          docker tag "$IMAGE_NAME:$IMMUTABLE_TAG" "$IMAGE_NAME:$VERSION_TAG"
          docker push "$CI_IMAGE_NAME:$CI_IMMUTABLE_TAG" \
            2>&1 | tee "${{ runner.temp }}/ci-cycles-push-immutable.log"
          docker push "$CI_IMAGE_NAME:$CI_VERSION_TAG" \
            2>&1 | tee "${{ runner.temp }}/ci-cycles-push-version.log"
          docker push "$IMAGE_NAME:$IMMUTABLE_TAG" \
            2>&1 | tee "${{ runner.temp }}/cycles-push-immutable.log"
          docker push "$IMAGE_NAME:$VERSION_TAG" \
            2>&1 | tee "${{ runner.temp }}/cycles-push-version.log"

          docker buildx imagetools inspect "$CI_IMAGE_NAME:$CI_IMMUTABLE_TAG" \
            | tee "${{ runner.temp }}/ci-cycles-remote-immutable.txt"
          docker buildx imagetools inspect "$CI_IMAGE_NAME:$CI_VERSION_TAG" \
            | tee "${{ runner.temp }}/ci-cycles-remote-version.txt"
          docker buildx imagetools inspect "$IMAGE_NAME:$IMMUTABLE_TAG" \
            | tee "${{ runner.temp }}/cycles-remote-immutable.txt"
          docker buildx imagetools inspect "$IMAGE_NAME:$VERSION_TAG" \
            | tee "${{ runner.temp }}/cycles-remote-version.txt"

          ci_immutable_digest="$(sed -n 's/^Digest:[[:space:]]*//p' \
            "${{ runner.temp }}/ci-cycles-remote-immutable.txt" | head -1)"
          ci_version_digest="$(sed -n 's/^Digest:[[:space:]]*//p' \
            "${{ runner.temp }}/ci-cycles-remote-version.txt" | head -1)"
          immutable_digest="$(sed -n 's/^Digest:[[:space:]]*//p' \
            "${{ runner.temp }}/cycles-remote-immutable.txt" | head -1)"
          version_digest="$(sed -n 's/^Digest:[[:space:]]*//p' \
            "${{ runner.temp }}/cycles-remote-version.txt" | head -1)"
          [[ "$ci_immutable_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$ci_immutable_digest" = "$ci_version_digest"
          [[ "$immutable_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$immutable_digest" = "$version_digest"
          printf '%s@%s\n' "$CI_IMAGE_NAME" "$ci_immutable_digest" \
            | tee "${{ runner.temp }}/ci-cycles-immutable-image.txt"
          printf '%s@%s\n' "$IMAGE_NAME" "$immutable_digest" \
            | tee "${{ runner.temp }}/cycles-immutable-image.txt"

      - name: Verify anonymous public access
        if: success()
        env:
          CI_IMMUTABLE_TAG: ${{ env.CI_VERSION_TAG }}-${{ github.sha }}
          IMMUTABLE_TAG: ${{ env.VERSION_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker logout ghcr.io
          docker buildx imagetools inspect "$CI_IMAGE_NAME:$CI_IMMUTABLE_TAG" \
            | tee "${{ runner.temp }}/ci-cycles-anonymous-inspect.txt"
          docker buildx imagetools inspect "$IMAGE_NAME:$IMMUTABLE_TAG" \
            | tee "${{ runner.temp }}/cycles-anonymous-inspect.txt"
          grep -q '^Digest:[[:space:]]*sha256:' \
            "${{ runner.temp }}/ci-cycles-anonymous-inspect.txt"
          grep -q '^Digest:[[:space:]]*sha256:' \
            "${{ runner.temp }}/cycles-anonymous-inspect.txt"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cycles-hydra-build-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/ci-cycles-docker-build.log
            ${{ runner.temp }}/ci-cycles-image-validation.log
            ${{ runner.temp }}/cycles-docker-build.log
            ${{ runner.temp }}/cycles-image-validation.log
            ${{ runner.temp }}/cycles-smoke.log
            ${{ runner.temp }}/cycles-disabled-gpu-smoke.sha256
            ${{ runner.temp }}/cycles-gpu-enabled-smoke.log
            ${{ runner.temp }}/cycles-gpu-enabled-smoke.sha256
            ${{ runner.temp }}/ci-cycles-push-immutable.log
            ${{ runner.temp }}/ci-cycles-push-version.log
            ${{ runner.temp }}/cycles-push-immutable.log
            ${{ runner.temp }}/cycles-push-version.log
            ${{ runner.temp }}/ci-cycles-remote-immutable.txt
            ${{ runner.temp }}/ci-cycles-remote-version.txt
            ${{ runner.temp }}/cycles-remote-immutable.txt
            ${{ runner.temp }}/cycles-remote-version.txt
            ${{ runner.temp }}/ci-cycles-immutable-image.txt
            ${{ runner.temp }}/cycles-immutable-image.txt
            ${{ runner.temp }}/ci-cycles-anonymous-inspect.txt
            ${{ runner.temp }}/cycles-anonymous-inspect.txt
