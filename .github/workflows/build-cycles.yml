name: Build Cycles Hydra Delegate

on:
  workflow_dispatch:
    inputs:
      reuse_dependency_image:
        description: Reuse the validated versioned ci-cycles image from GHCR
        required: false
        type: boolean
        default: false
      reuse_delegate_candidate:
        description: Reuse the loader-validated, render-unvalidated delegate candidate
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: cycles-hydra-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_IMAGE: aswf/ci-baseqt:2026@sha256:47804083985e25cecbbb6988be2c1933195bd96bb3c41b0db96f07ae8815ca69
  CYCLES_TAG: v5.2.0
  CYCLES_REVISION: 3b97e190c5ff1a2ed2160d879ad5bf95bea7b8ba
  CYCLES_LIB_REVISION: 30d9f881c4b62c52323fd11637eeea56d460e35c
  OPENUSD_TAG: v26.03
  OPENUSD_REVISION: 1818e14bae0036ac4bc7b4e60826b5797076a4fe
  CI_IMAGE_NAME: ghcr.io/nicolaspopravka/ci-cycles
  CI_VERSION_TAG: cycles-libs-5.2-openusd-26.03-cy2026
  IMAGE_NAME: ghcr.io/nicolaspopravka/usd-render-benchmark-cycles
  VERSION_TAG: cycles-5.2.0-openusd-26.03-cy2026

jobs:
  build:
    name: cycles-5.2.0-openusd-26.03-cy2026-split
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      USD_LINKAGE: split
      CI_VARIANT_TAG: cycles-libs-5.2-openusd-26.03-cy2026-split
      VARIANT_TAG: cycles-5.2.0-openusd-26.03-cy2026-split
      CANDIDATE_TAG: candidate-cycles-5.2.0-openusd-26.03-cy2026-split

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Reclaim runner disk
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/local/julia* \
            /usr/lib/jvm
          sudo apt-get clean
          docker system prune -af
          df -h /

      - name: Validate immutable inputs
        run: |
          set -eux
          [[ "$BASE_IMAGE" == *@sha256:* ]]
          [[ "$CYCLES_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CYCLES_LIB_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPENUSD_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$USD_LINKAGE" == split || "$USD_LINKAGE" == monolithic ]]
          [[ "$CI_IMAGE_NAME" == "${CI_IMAGE_NAME,,}" ]]
          [[ "$IMAGE_NAME" == "${IMAGE_NAME,,}" ]]
          test -f ci-cycles/Dockerfile.dependencies
          test -f ci-cycles/Dockerfile
          test -f ci-cycles/build_dependencies.sh
          test -f ci-cycles/build_cycles.sh
          test -f ci-cycles/cycles-hdsi.patch
          test -f ci-cycles/smoke.usda
          test -f ci-cycles/camera-direction.usda
          test -f ci-cycles/check_png_variation.py

      - name: Build immutable dependency image
        if: ${{ !inputs.reuse_delegate_candidate && !inputs.reuse_dependency_image }}
        env:
          CI_IMMUTABLE_TAG: ${{ env.CI_VARIANT_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker build --progress=plain \
            --file ci-cycles/Dockerfile.dependencies \
            --tag "$CI_IMAGE_NAME:$CI_IMMUTABLE_TAG" \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg WORKFLOW_REVISION="$GITHUB_SHA" \
            --build-arg CYCLES_LIB_REVISION="$CYCLES_LIB_REVISION" \
            --build-arg OPENUSD_TAG="$OPENUSD_TAG" \
            --build-arg OPENUSD_REVISION="$OPENUSD_REVISION" \
            --build-arg USD_LINKAGE="$USD_LINKAGE" \
            . 2>&1 | tee "${{ runner.temp }}/ci-cycles-docker-build.log"
          printf 'DEPENDENCY_IMAGE_REF=%s:%s\n' \
            "$CI_IMAGE_NAME" "$CI_IMMUTABLE_TAG" >> "$GITHUB_ENV"

      - name: Pull validated dependency image
        if: ${{ !inputs.reuse_delegate_candidate && inputs.reuse_dependency_image }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$CI_IMAGE_NAME:$CI_VARIANT_TAG"
          printf 'DEPENDENCY_IMAGE_REF=%s:%s\n' \
            "$CI_IMAGE_NAME" "$CI_VARIANT_TAG" >> "$GITHUB_ENV"

      - name: Validate dependency image boundary
        if: ${{ !inputs.reuse_delegate_candidate }}
        run: |
          set -euxo pipefail
          docker run --rm \
            --env CYCLES_LIB_REVISION \
            "$DEPENDENCY_IMAGE_REF" bash -c '
            set -euxo pipefail
            test -x /opt/usd/bin/usdrecord
            test -e /opt/usd/lib/libtbb.so.12
            test -d /opt/cycles-dependencies
            test -d /opt/cycles-dependencies/.git
            python3 -c "import PySide6; print(PySide6.__version__)"
            test "$(git -C /opt/cycles-dependencies rev-parse HEAD)" = \
              "$CYCLES_LIB_REVISION"
            test ! -e /opt/cycles
            test ! -e /opt/cycles-dependencies/hydra/hdCycles.so
          ' | tee "${{ runner.temp }}/ci-cycles-image-validation.log"

      - name: Publish validated dependency image
        if: ${{ !inputs.reuse_delegate_candidate && !inputs.reuse_dependency_image }}
        env:
          CI_IMMUTABLE_TAG: ${{ env.CI_VARIANT_TAG }}-${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$CI_IMAGE_NAME:$CI_IMMUTABLE_TAG" \
            "$CI_IMAGE_NAME:$CI_VARIANT_TAG"
          docker push "$CI_IMAGE_NAME:$CI_IMMUTABLE_TAG" \
            2>&1 | tee "${{ runner.temp }}/ci-cycles-push-immutable.log"
          docker push "$CI_IMAGE_NAME:$CI_VARIANT_TAG" \
            2>&1 | tee "${{ runner.temp }}/ci-cycles-push-version.log"
          docker buildx imagetools inspect "$CI_IMAGE_NAME:$CI_IMMUTABLE_TAG" \
            | tee "${{ runner.temp }}/ci-cycles-remote-immutable.txt"
          docker buildx imagetools inspect "$CI_IMAGE_NAME:$CI_VARIANT_TAG" \
            | tee "${{ runner.temp }}/ci-cycles-remote-version.txt"

      - name: Build immutable delegate image
        if: ${{ !inputs.reuse_delegate_candidate }}
        env:
          IMMUTABLE_TAG: ${{ env.VARIANT_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker build --progress=plain \
            --file ci-cycles/Dockerfile \
            --tag "$IMAGE_NAME:$IMMUTABLE_TAG" \
            --build-arg DEPENDENCY_IMAGE="$DEPENDENCY_IMAGE_REF" \
            --build-arg ASWF_SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg WORKFLOW_REVISION="$GITHUB_SHA" \
            --build-arg CYCLES_TAG="$CYCLES_TAG" \
            --build-arg CYCLES_REVISION="$CYCLES_REVISION" \
            --build-arg CYCLES_LIB_REVISION="$CYCLES_LIB_REVISION" \
            --build-arg OPENUSD_TAG="$OPENUSD_TAG" \
            --build-arg OPENUSD_REVISION="$OPENUSD_REVISION" \
            --build-arg USD_LINKAGE="$USD_LINKAGE" \
            . 2>&1 | tee "${{ runner.temp }}/cycles-docker-build.log"

      - name: Pull loader-validated delegate candidate
        if: ${{ inputs.reuse_delegate_candidate }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMMUTABLE_TAG: ${{ env.VARIANT_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE_NAME:$CANDIDATE_TAG"
          docker tag "$IMAGE_NAME:$CANDIDATE_TAG" "$IMAGE_NAME:$IMMUTABLE_TAG"

      - name: Validate delegate and dependency closure
        env:
          IMMUTABLE_TAG: ${{ env.VARIANT_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker run --rm \
            --env USD_LINKAGE \
            "$IMAGE_NAME:$IMMUTABLE_TAG" bash -c '
            set -euxo pipefail
            test -x /opt/usd/bin/usdrecord
            test -x /opt/cycles/cycles
            test -f /opt/cycles/hydra/hdCycles.so
            python3 -c "from pxr import Usd, UsdImagingGL; print(Usd.GetVersion()); plugins = UsdImagingGL.Engine.GetRendererPlugins(); names = [UsdImagingGL.Engine.GetRendererDisplayName(p) for p in plugins]; print(list(zip(plugins, names))); assert \"Cycles\" in names"
            ldd -r /opt/cycles/hydra/hdCycles.so | tee /tmp/hdCycles-ldd.txt
            ! grep -Eq "not found|undefined symbol" /tmp/hdCycles-ldd.txt
            grep -q "libtbb.so.12" /tmp/hdCycles-ldd.txt
            ! grep -q "libtbb.so.2 " /tmp/hdCycles-ldd.txt
            if [[ "$USD_LINKAGE" == split ]]; then
              grep -q "libusd_hdsi" /tmp/hdCycles-ldd.txt
            else
              grep -q "libusd_usd_m" /tmp/hdCycles-ldd.txt
            fi
          ' | tee "${{ runner.temp }}/cycles-image-validation.log"

      - name: Publish loader-validated delegate candidate
        if: ${{ !inputs.reuse_delegate_candidate }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMMUTABLE_TAG: ${{ env.VARIANT_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          candidate_immutable_tag="$CANDIDATE_TAG-$GITHUB_SHA"
          docker tag "$IMAGE_NAME:$IMMUTABLE_TAG" \
            "$IMAGE_NAME:$candidate_immutable_tag"
          docker tag "$IMAGE_NAME:$IMMUTABLE_TAG" "$IMAGE_NAME:$CANDIDATE_TAG"
          docker push "$IMAGE_NAME:$candidate_immutable_tag" \
            2>&1 | tee "${{ runner.temp }}/cycles-candidate-push-immutable.log"
          docker push "$IMAGE_NAME:$CANDIDATE_TAG" \
            2>&1 | tee "${{ runner.temp }}/cycles-candidate-push-version.log"
          docker buildx imagetools inspect "$IMAGE_NAME:$candidate_immutable_tag" \
            | tee "${{ runner.temp }}/cycles-candidate-remote-immutable.txt"
          docker buildx imagetools inspect "$IMAGE_NAME:$CANDIDATE_TAG" \
            | tee "${{ runner.temp }}/cycles-candidate-remote-version.txt"
          immutable_digest="$(sed -n 's/^Digest:[[:space:]]*//p' \
            "${{ runner.temp }}/cycles-candidate-remote-immutable.txt" | head -1)"
          version_digest="$(sed -n 's/^Digest:[[:space:]]*//p' \
            "${{ runner.temp }}/cycles-candidate-remote-version.txt" | head -1)"
          [[ "$immutable_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$immutable_digest" = "$version_digest"
          printf '%s@%s\n' "$IMAGE_NAME" "$immutable_digest" \
            | tee "${{ runner.temp }}/cycles-candidate-image.txt"

      - name: Run Cycles standalone USD diagnostic
        id: standalone_smoke
        continue-on-error: true
        env:
          IMMUTABLE_TAG: ${{ env.VARIANT_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          mkdir -p "${{ runner.temp }}/cycles-smoke"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/ci-cycles:/test:ro" \
            --volume "${{ runner.temp }}/cycles-smoke:/out" \
            "$IMAGE_NAME:$IMMUTABLE_TAG" \
            cycles \
              --background \
              --device CPU \
              --samples 80 \
              --width 128 \
              --height 93 \
              --log-level debug \
              --output /out/cycles-standalone-smoke.png \
              /test/smoke.usda \
            2>&1 | tee "${{ runner.temp }}/cycles-standalone-smoke.log"
          python3 ci-cycles/check_png_variation.py \
            "${{ runner.temp }}/cycles-smoke/cycles-standalone-smoke.png"
          sha256sum \
            "${{ runner.temp }}/cycles-smoke/cycles-standalone-smoke.png" \
            | tee "${{ runner.temp }}/cycles-standalone-smoke.sha256"

      - name: Run Cycles standalone camera-direction diagnostic
        id: camera_direction_smoke
        continue-on-error: true
        env:
          IMMUTABLE_TAG: ${{ env.VARIANT_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          mkdir -p "${{ runner.temp }}/cycles-smoke"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/ci-cycles:/test:ro" \
            --volume "${{ runner.temp }}/cycles-smoke:/out" \
            "$IMAGE_NAME:$IMMUTABLE_TAG" \
            cycles \
              --background \
              --device CPU \
              --samples 80 \
              --width 128 \
              --height 93 \
              --log-level debug \
              --output /out/cycles-camera-direction-smoke.png \
              /test/camera-direction.usda \
            2>&1 | tee "${{ runner.temp }}/cycles-camera-direction-smoke.log"
          python3 ci-cycles/check_png_variation.py \
            "${{ runner.temp }}/cycles-smoke/cycles-camera-direction-smoke.png"
          sha256sum \
            "${{ runner.temp }}/cycles-smoke/cycles-camera-direction-smoke.png" \
            | tee "${{ runner.temp }}/cycles-camera-direction-smoke.sha256"

      - name: Run benchmark-semantics usdrecord smoke
        id: benchmark_smoke
        continue-on-error: true
        env:
          IMMUTABLE_TAG: ${{ env.VARIANT_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          mkdir -p "${{ runner.temp }}/cycles-smoke"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/ci-cycles:/test:ro" \
            --volume "${{ runner.temp }}/cycles-smoke:/out" \
            "$IMAGE_NAME:$IMMUTABLE_TAG" \
            bash -c '
              set -euxo pipefail
              export DISPLAY=:99
              export LIBGL_ALWAYS_SOFTWARE=1
              export GALLIUM_DRIVER=llvmpipe
              export CYCLES_DEVICE=CPU
              export CYCLES_LOGGING=1
              export CYCLES_LOGGING_LEVEL=debug
              export TF_DEBUG=HD_ENGINE_PHASE_INFO,HD_SYNC_ALL,HD_RPRIM_ADDED,HD_RPRIM_UPDATED,HD_RPRIM_CLEANED,HD_SPRIM_ADDED
              unset MESA_LOADER_DRIVER_OVERRIDE
              Xvfb :99 -screen 0 640x480x24 \
                +extension GLX +render -noreset >/tmp/xvfb.log 2>&1 &
              xvfb_pid=$!
              trap "kill $xvfb_pid 2>/dev/null || true" EXIT
              sleep 2
              glxinfo -B | tee /tmp/glxinfo.log
              grep -Eqi \
                "OpenGL renderer string:.*llvmpipe|Device: llvmpipe" \
                /tmp/glxinfo.log
              usdrecord \
                --renderer Cycles \
                --camera /World/Camera \
                --imageWidth 128 \
                /test/smoke.usda \
                /out/cycles-gpu-enabled-smoke.png
              python3 /test/check_png_variation.py \
                /out/cycles-gpu-enabled-smoke.png
            ' | tee "${{ runner.temp }}/cycles-gpu-enabled-smoke.log"
          sha256sum \
            "${{ runner.temp }}/cycles-smoke/cycles-gpu-enabled-smoke.png" \
            | tee "${{ runner.temp }}/cycles-gpu-enabled-smoke.sha256"

      - name: Run optional Hydra-GPU-disabled diagnostic
        id: disable_gpu_smoke
        continue-on-error: true
        env:
          IMMUTABLE_TAG: ${{ env.VARIANT_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/ci-cycles:/test:ro" \
            --volume "${{ runner.temp }}/cycles-smoke:/out" \
            "$IMAGE_NAME:$IMMUTABLE_TAG" \
            bash -c '
              set -euxo pipefail
              export DISPLAY=:99
              export LIBGL_ALWAYS_SOFTWARE=1
              export GALLIUM_DRIVER=llvmpipe
              export CYCLES_DEVICE=CPU
              export CYCLES_LOGGING=1
              export CYCLES_LOGGING_LEVEL=debug
              export TF_DEBUG=HD_ENGINE_PHASE_INFO,HD_SYNC_ALL,HD_RPRIM_ADDED,HD_RPRIM_UPDATED,HD_RPRIM_CLEANED,HD_SPRIM_ADDED
              unset MESA_LOADER_DRIVER_OVERRIDE
              Xvfb :99 -screen 0 640x480x24 \
                +extension GLX +render -noreset >/tmp/xvfb.log 2>&1 &
              xvfb_pid=$!
              trap "kill $xvfb_pid 2>/dev/null || true" EXIT
              sleep 2
              glxinfo -B | tee /tmp/glxinfo.log
              grep -Eqi \
                "OpenGL renderer string:.*llvmpipe|Device: llvmpipe" \
                /tmp/glxinfo.log
              usdrecord \
                --disableGpu \
                --renderer Cycles \
                --camera /World/Camera \
                --imageWidth 128 \
                /test/smoke.usda \
                /out/cycles-disabled-gpu-smoke.png
              python3 /test/check_png_variation.py \
                /out/cycles-disabled-gpu-smoke.png
            ' | tee "${{ runner.temp }}/cycles-disabled-gpu-smoke.log"
          sha256sum "${{ runner.temp }}/cycles-smoke/cycles-disabled-gpu-smoke.png" \
            | tee "${{ runner.temp }}/cycles-disabled-gpu-smoke.sha256"

      - name: Upload smoke diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycles-split-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cycles-smoke/*.png
            ${{ runner.temp }}/cycles-*-smoke.log
            ${{ runner.temp }}/cycles-*-smoke.sha256
          if-no-files-found: error

      - name: Require benchmark-semantics smoke
        if: always()
        env:
          BENCHMARK_OUTCOME: ${{ steps.benchmark_smoke.outcome }}
          DISABLE_GPU_OUTCOME: ${{ steps.disable_gpu_smoke.outcome }}
          STANDALONE_OUTCOME: ${{ steps.standalone_smoke.outcome }}
          CAMERA_DIRECTION_OUTCOME: ${{ steps.camera_direction_smoke.outcome }}
        run: |
          printf 'Cycles standalone outcome: %s\n' "$STANDALONE_OUTCOME"
          printf 'camera-direction outcome: %s\n' "$CAMERA_DIRECTION_OUTCOME"
          printf 'benchmark-semantics outcome: %s\n' "$BENCHMARK_OUTCOME"
          printf 'disableGpu diagnostic outcome: %s\n' "$DISABLE_GPU_OUTCOME"
          test "$BENCHMARK_OUTCOME" = success

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish validated images
        env:
          IMMUTABLE_TAG: ${{ env.VARIANT_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker tag "$IMAGE_NAME:$IMMUTABLE_TAG" "$IMAGE_NAME:$VARIANT_TAG"
          docker push "$IMAGE_NAME:$IMMUTABLE_TAG" \
            2>&1 | tee "${{ runner.temp }}/cycles-push-immutable.log"
          docker push "$IMAGE_NAME:$VARIANT_TAG" \
            2>&1 | tee "${{ runner.temp }}/cycles-push-version.log"

          docker buildx imagetools inspect "$IMAGE_NAME:$IMMUTABLE_TAG" \
            | tee "${{ runner.temp }}/cycles-remote-immutable.txt"
          docker buildx imagetools inspect "$IMAGE_NAME:$VARIANT_TAG" \
            | tee "${{ runner.temp }}/cycles-remote-version.txt"

          immutable_digest="$(sed -n 's/^Digest:[[:space:]]*//p' \
            "${{ runner.temp }}/cycles-remote-immutable.txt" | head -1)"
          version_digest="$(sed -n 's/^Digest:[[:space:]]*//p' \
            "${{ runner.temp }}/cycles-remote-version.txt" | head -1)"
          [[ "$immutable_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$immutable_digest" = "$version_digest"
          printf '%s@%s\n' "$IMAGE_NAME" "$immutable_digest" \
            | tee "${{ runner.temp }}/cycles-immutable-image.txt"

      - name: Verify anonymous public access
        if: success()
        env:
          IMMUTABLE_TAG: ${{ env.VARIANT_TAG }}-${{ github.sha }}
        run: |
          set -euxo pipefail
          docker logout ghcr.io
          docker buildx imagetools inspect "$IMAGE_NAME:$IMMUTABLE_TAG" \
            | tee "${{ runner.temp }}/cycles-anonymous-inspect.txt"
          grep -q '^Digest:[[:space:]]*sha256:' \
            "${{ runner.temp }}/cycles-anonymous-inspect.txt"

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cycles-hydra-build-split-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/ci-cycles-docker-build.log
            ${{ runner.temp }}/ci-cycles-image-validation.log
            ${{ runner.temp }}/cycles-docker-build.log
            ${{ runner.temp }}/cycles-image-validation.log
            ${{ runner.temp }}/cycles-candidate-push-immutable.log
            ${{ runner.temp }}/cycles-candidate-push-version.log
            ${{ runner.temp }}/cycles-candidate-remote-immutable.txt
            ${{ runner.temp }}/cycles-candidate-remote-version.txt
            ${{ runner.temp }}/cycles-candidate-image.txt
            ${{ runner.temp }}/cycles-disabled-gpu-smoke.log
            ${{ runner.temp }}/cycles-disabled-gpu-smoke.sha256
            ${{ runner.temp }}/cycles-gpu-enabled-smoke.log
            ${{ runner.temp }}/cycles-gpu-enabled-smoke.sha256
            ${{ runner.temp }}/ci-cycles-push-immutable.log
            ${{ runner.temp }}/ci-cycles-push-version.log
            ${{ runner.temp }}/cycles-push-immutable.log
            ${{ runner.temp }}/cycles-push-version.log
            ${{ runner.temp }}/ci-cycles-remote-immutable.txt
            ${{ runner.temp }}/ci-cycles-remote-version.txt
            ${{ runner.temp }}/cycles-remote-immutable.txt
            ${{ runner.temp }}/cycles-remote-version.txt
            ${{ runner.temp }}/ci-cycles-immutable-image.txt
            ${{ runner.temp }}/cycles-immutable-image.txt
            ${{ runner.temp }}/ci-cycles-anonymous-inspect.txt
            ${{ runner.temp }}/cycles-anonymous-inspect.txt
