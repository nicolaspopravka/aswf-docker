name: CY2025 OpenUSD MaterialX diagnostic

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Diagnostic variant
        required: true
        default: pixar-parity
        type: choice
        options:
          - pixar-parity
          - pixar-materialx
          - pixar-materialx-layout
          - pixar-core-tbb
          - pixar-build-usd
          - pixar-build-usd-ci-common5
          - stock-options
      render_context:
        description: OpenGL context used by the render smoke test
        required: true
        default: stock-xvfb
        type: choice
        options:
          - stock-xvfb
          - egl-noqt
      reuse_run_id:
        description: Prior run whose deployed packages should be reused; leave empty for a full rebuild
        required: false
        default: ''
        type: string
      external_prefix_url:
        description: Optional trusted tar.gz containing a Pixar prefix; requires reuse_run_id and SHA-256
        required: false
        default: ''
        type: string
      external_prefix_sha256:
        description: SHA-256 for external_prefix_url
        required: false
        default: ''
        type: string

jobs:
  diagnostic:
    if: github.repository_owner != 'AcademySoftwareFoundation'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Capture capacity and reclaim runner disk
        env:
          DIAGNOSTIC_REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          set -o pipefail
          mkdir -p diagnostic-artifacts/metadata
          scripts/tests/cy2025_openusd_materialx_diagnostic.sh capacity \
            2>&1 | tee diagnostic-artifacts/metadata/current-capacity.log
      - name: Download prior deployed packages
        if: inputs.reuse_run_id != '' && inputs.external_prefix_url == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cy2025-openusd-materialx-${{ inputs.variant }}-${{ inputs.reuse_run_id }}
          path: diagnostic-artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reuse_run_id }}
      - name: Download external Pixar prefix
        if: inputs.external_prefix_url != ''
        env:
          EXTERNAL_PREFIX_URL: ${{ inputs.external_prefix_url }}
          EXTERNAL_PREFIX_SHA256: ${{ inputs.external_prefix_sha256 }}
          DIAGNOSTIC_REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          set -euo pipefail
          [[ -n "${DIAGNOSTIC_REUSE_RUN_ID}" ]]
          [[ "${EXTERNAL_PREFIX_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          archive="${RUNNER_TEMP}/external-pixar-prefix.tgz"
          curl -L --fail --retry 3 -o "${archive}" "${EXTERNAL_PREFIX_URL}"
          echo "${EXTERNAL_PREFIX_SHA256}  ${archive}" \
            | sha256sum --check \
            | tee diagnostic-artifacts/metadata/external-prefix-sha256.txt
          mkdir -p diagnostic-artifacts/results/pixar-install
          tar -xzf "${archive}" --strip-components=2 \
            --exclude='*/src' --exclude='*/src/*' \
            --exclude='*/build' --exclude='*/build/*' \
            -C diagnostic-artifacts/results/pixar-install
          printf '%s\n' "${EXTERNAL_PREFIX_URL}" \
            > diagnostic-artifacts/metadata/external-prefix-url.txt
      - name: Build or reuse matched CY2025 packages and test
        env:
          DIAGNOSTIC_VARIANT: ${{ inputs.variant }}
          DIAGNOSTIC_REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          DIAGNOSTIC_RENDER_CONTEXT: ${{ inputs.render_context }}
        run: |
          set -o pipefail
          mode=run
          if [[ -n "${DIAGNOSTIC_REUSE_RUN_ID}" ]]; then
            mode=reuse
          fi
          scripts/tests/cy2025_openusd_materialx_diagnostic.sh "${mode}" \
            2>&1 | tee diagnostic-artifacts/driver.log
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cy2025-openusd-materialx-${{ inputs.variant }}-${{ github.run_id }}
          path: diagnostic-artifacts
          if-no-files-found: warn
          retention-days: 14
