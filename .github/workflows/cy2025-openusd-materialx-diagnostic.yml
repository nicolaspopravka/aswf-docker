name: CY2025 OpenUSD MaterialX diagnostic

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Diagnostic variant
        required: true
        default: pixar-parity
        type: choice
        options:
          - pixar-parity
          - stock-options
      reuse_run_id:
        description: Prior run whose deployed packages should be reused; leave empty for a full rebuild
        required: false
        default: ''
        type: string

jobs:
  diagnostic:
    if: github.repository_owner != 'AcademySoftwareFoundation'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Capture capacity and reclaim runner disk
        env:
          DIAGNOSTIC_REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          set -o pipefail
          mkdir -p diagnostic-artifacts/metadata
          scripts/tests/cy2025_openusd_materialx_diagnostic.sh capacity \
            2>&1 | tee diagnostic-artifacts/metadata/capacity.log
      - name: Download prior deployed packages
        if: inputs.reuse_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cy2025-openusd-materialx-${{ inputs.variant }}-${{ inputs.reuse_run_id }}
          path: diagnostic-artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reuse_run_id }}
      - name: Build or reuse matched CY2025 packages and test
        env:
          DIAGNOSTIC_VARIANT: ${{ inputs.variant }}
          DIAGNOSTIC_REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
        run: |
          set -o pipefail
          mode=run
          if [[ -n "${DIAGNOSTIC_REUSE_RUN_ID}" ]]; then
            mode=reuse
          fi
          scripts/tests/cy2025_openusd_materialx_diagnostic.sh "${mode}" \
            2>&1 | tee diagnostic-artifacts/driver.log
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cy2025-openusd-materialx-${{ inputs.variant }}-${{ github.run_id }}
          path: diagnostic-artifacts
          if-no-files-found: warn
          retention-days: 14
