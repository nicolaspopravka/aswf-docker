name: Probe Cycles Hydra benchmark issues 30-32

on:
  workflow_dispatch:
  push:
    branches:
      - codex/diagnostics/cycles-hydra-issues-30-32

permissions:
  contents: read
  packages: write

concurrency:
  group: cycles-hydra-issues30-32-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPENDENCY_IMAGE: ghcr.io/nicolaspopravka/ci-cycles@sha256:90b74ac9ec19059fa79ce5766f95bcc3142ebb359c4f72bb28fef2fb1901c936
  IMAGE_NAME: cycles-hydra-issues30-32
  PUBLISHED_IMAGE: ghcr.io/nicolaspopravka/usd-render-benchmark-cycles
  CYCLES_REVISION: 1319002982e09970cb50f727e3f299cea78de229
  CYCLES_LIB_REVISION: 30d9f881c4b62c52323fd11637eeea56d460e35c
  OPENUSD_REVISION: 2095fafafd033fa23386d7ec6d58c7cc33974518

jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate fixed inputs
        run: |
          set -euxo pipefail
          [[ "$DEPENDENCY_IMAGE" == *@sha256:* ]]
          [[ "$CYCLES_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CYCLES_LIB_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPENUSD_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test -f ci-cycles/Dockerfile.issues30-32
          test -f ci-cycles/build_cycles_issues30_32.sh
          test -f ci-cycles/issues30-32/cycles-hydra-issues30-32.patch
          test -f ci-cycles/issues30-32/cycles-hydra-batched-teardown.patch
          test -f ci-cycles/issues30-32/generate_teardown_fixture.py
          test -f ci-cycles/issues30-32/measure_teardown.py
          test -f ci-cycles/issues30-32/updateconnections.usda
          test -f ci-cycles/issues30-32/udim.usda
          test -f ci-cycles/issue32/cycles-issue32-displacement.usda
          git diff --check
          sha256sum ci-cycles/issues30-32/*

      - name: Reclaim runner disk
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/local/julia* \
            /usr/lib/jvm
          sudo apt-get clean
          docker system prune -af
          df -h /

      - name: Build exact combined Cycles delegate
        run: |
          set -euxo pipefail
          docker build --progress=plain \
            --file ci-cycles/Dockerfile.issues30-32 \
            --tag "$IMAGE_NAME:$GITHUB_SHA" \
            --build-arg DEPENDENCY_IMAGE="$DEPENDENCY_IMAGE" \
            --build-arg WORKFLOW_REVISION="$GITHUB_SHA" \
            --build-arg CYCLES_REVISION="$CYCLES_REVISION" \
            --build-arg CYCLES_LIB_REVISION="$CYCLES_LIB_REVISION" \
            --build-arg OPENUSD_REVISION="$OPENUSD_REVISION" \
            . 2>&1 | tee "${{ runner.temp }}/build.log"

      - name: Validate delegate and exact source patch
        run: |
          set -euxo pipefail
          evidence="${{ runner.temp }}/evidence"
          mkdir -p "$evidence"
          docker image inspect "$IMAGE_NAME:$GITHUB_SHA" > "$evidence/image-inspect.json"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/ci-cycles/issues30-32:/expected:ro" \
            --volume "$evidence:/out" \
            "$IMAGE_NAME:$GITHUB_SHA" bash -c '
              set -euxo pipefail
              test -f /opt/cycles/hydra/hdCycles.so
              test -f /opt/cycles-baseline/hydra/hdCycles.so
              test -x /usr/local/cuda/bin/nvcc
              test -f "$OPTIX_ROOT_DIR/include/optix.h"
              sed "/^index /d" /expected/cycles-hydra-issues30-32.patch \
                > /tmp/expected-source.patch
              sed "/^index /d" /opt/cycles-build-evidence/cycles-source.patch \
                > /tmp/applied-source.patch
              cmp /tmp/expected-source.patch /tmp/applied-source.patch
              python3 -c "from pxr import UsdImagingGL; names = [UsdImagingGL.Engine.GetRendererDisplayName(p) for p in UsdImagingGL.Engine.GetRendererPlugins()]; print(names); assert \"Cycles\" in names"
              ldd -r /opt/cycles/hydra/hdCycles.so | tee /out/hdCycles-ldd.txt
              if grep -Eq "not found|undefined symbol" /out/hdCycles-ldd.txt; then
                echo "Unresolved hdCycles runtime dependency" >&2
                exit 1
              fi
              cp -a /opt/cycles-build-evidence/. /out/
            '
          sudo chown -R "$USER:$USER" "$evidence"

      - name: Run material and AOV fixtures
        run: |
          set -euxo pipefail
          evidence="${{ runner.temp }}/evidence"
          fixture="$GITHUB_WORKSPACE/ci-cycles/issues30-32"
          displacement="$GITHUB_WORKSPACE/ci-cycles/issue32"

          sed 's/tile.<UDIM>.ppm/single.ppm/' \
            "$fixture/udim.usda" > "$evidence/single.usda"
          sed 's/tile.<UDIM>.ppm/missing.<UDIM>.ppm/' \
            "$fixture/udim.usda" > "$evidence/missing-udim.usda"
          cp "$fixture/single.ppm" "$evidence/single.ppm"

          docker run --rm \
            --volume "$fixture:/fixtures:ro" \
            --volume "$displacement:/displacement:ro" \
            --volume "$evidence:/out" \
            "$IMAGE_NAME:$GITHUB_SHA" bash -c '
              set -euxo pipefail
              export CYCLES_DEVICE=CPU

              usdrecord --disableGpu --renderer Cycles --camera /World/Camera --imageWidth 128 \
                /fixtures/updateconnections.usda /out/updateconnections.png \
                > /out/updateconnections.log 2>&1
              usdrecord --disableGpu --renderer Cycles --camera /World/Camera --imageWidth 128 \
                /displacement/cycles-issue32-displacement.usda /out/displacement.png \
                > /out/displacement.log 2>&1
              usdrecord --disableGpu --renderer Cycles --camera /World/Camera --imageWidth 256 \
                /fixtures/udim.usda /out/udim.png > /out/udim.log 2>&1
              usdrecord --disableGpu --renderer Cycles --camera /World/Camera --imageWidth 128 \
                /out/single.usda /out/single.png > /out/single.log 2>&1

              set +e
              usdrecord --disableGpu --renderer Cycles --camera /World/Camera --imageWidth 128 \
                /out/missing-udim.usda /out/missing-udim.png \
                > /out/missing-udim.log 2>&1
              printf "%s\n" "$?" > /out/missing-udim.status
            '
          sudo chown -R "$USER:$USER" "$evidence"

          grep -Fq "maps to unavailable Cycles input 'specular'" \
            "$evidence/updateconnections.log"
          grep -Fq "Unsupported USD input 'occlusion'" \
            "$evidence/updateconnections.log"
          grep -Fq "input 'bogusInput' was not found" \
            "$evidence/updateconnections.log"
          test "$(grep -c "Unsupported USD input 'displacement'.*value ignored" \
            "$evidence/displacement.log")" = 1
          if grep -q "Could not find terminal output.*Displacement" \
            "$evidence/displacement.log"; then
            exit 1
          fi
          if grep -Fq '<UDIM>' "$evidence/udim.log"; then
            exit 1
          fi
          if grep -Eq 'does not exist|Failed to load|Recording aborted' \
            "$evidence/udim.log" "$evidence/single.log"; then
            exit 1
          fi
          if grep -Fq 'Unknown pass elementId' "$evidence/"*.log; then
            exit 1
          fi
          grep -Fq 'Renderer plugin: HdCyclesPlugin' "$evidence/udim.log"
          test "$(cat "$evidence/missing-udim.status")" != 139
          grep -Fq 'missing.<UDIM>.ppm' "$evidence/missing-udim.log"

          python3 ci-cycles/check_png_variation.py \
            "$evidence/updateconnections.png" --expected-width 128 || true
          python3 ci-cycles/issues30-32/check_udim_png.py "$evidence/udim.png"
          python3 ci-cycles/check_png_variation.py \
            "$evidence/single.png" --expected-width 128
          file "$evidence/"*.png
          sha256sum "$evidence/"*.png > "$evidence/image-sha256.txt"

      - name: Publish validated candidate image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          evidence="${{ runner.temp }}/evidence"
          immutable_tag="hydra-issues30-32-$GITHUB_SHA"
          image_ref="$PUBLISHED_IMAGE:$immutable_tag"

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$image_ref"
          docker push "$image_ref" \
            2>&1 | tee "$evidence/candidate-image-push.log"

          docker buildx imagetools inspect "$image_ref" \
            | tee "$evidence/candidate-image-inspect.txt"
          digest="$(sed -n 's/^Digest:[[:space:]]*//p' \
            "$evidence/candidate-image-inspect.txt" | head -1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s@%s\n' "$PUBLISHED_IMAGE" "$digest" \
            | tee "$evidence/candidate-image-ref.txt"

          docker logout ghcr.io
          docker buildx imagetools inspect "$image_ref" \
            | tee "$evidence/candidate-image-anonymous-inspect.txt"
          grep -q "^Digest:[[:space:]]*$digest$" \
            "$evidence/candidate-image-anonymous-inspect.txt"

      - name: Compare synthetic Hydra teardown
        run: |
          set -euxo pipefail
          evidence="${{ runner.temp }}/evidence"
          fixture="$GITHUB_WORKSPACE/ci-cycles/issues30-32"

          docker run --rm \
            --volume "$fixture:/fixtures:ro" \
            --volume "$evidence:/out" \
            "$IMAGE_NAME:$GITHUB_SHA" \
            python3 /fixtures/generate_teardown_fixture.py \
              /out/teardown.usda --geometry-count 12000

          set +e
          docker run --rm \
            --volume "$fixture:/fixtures:ro" \
            --volume "$evidence:/out" \
            --env PXR_PLUGINPATH_NAME=/opt/cycles-baseline/hydra \
            --env LD_LIBRARY_PATH=/opt/cycles-baseline/lib:/opt/cycles-dependencies/lib:/opt/cycles-dependencies/tbb/lib:/opt/usd/lib:/opt/usd/lib64 \
            "$IMAGE_NAME:$GITHUB_SHA" \
            timeout --signal=INT --kill-after=15s 3m \
              python3 /fixtures/measure_teardown.py \
                /out/teardown.usda /out/teardown-baseline.png \
                /out/teardown-baseline.json \
            > "$evidence/teardown-baseline.log" 2>&1
          baseline_status=$?
          set -e
          printf '%s\n' "$baseline_status" > "$evidence/teardown-baseline.status"

          docker run --rm \
            --volume "$fixture:/fixtures:ro" \
            --volume "$evidence:/out" \
            "$IMAGE_NAME:$GITHUB_SHA" \
            timeout --signal=INT --kill-after=15s 3m \
              python3 /fixtures/measure_teardown.py \
                /out/teardown.usda /out/teardown-patched.png \
                /out/teardown-patched.json \
            > "$evidence/teardown-patched.log" 2>&1

          grep -Fq '"event": "record_complete"' "$evidence/teardown-baseline.log"
          grep -Fq '"event": "record_complete"' "$evidence/teardown-patched.log"
          test -s "$evidence/teardown-patched.json"

          EVIDENCE="$evidence" BASELINE_STATUS="$baseline_status" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["EVIDENCE"])
          status = int(os.environ["BASELINE_STATUS"])
          patched = json.loads((evidence / "teardown-patched.json").read_text())
          patched_seconds = patched["teardown_seconds"]
          if patched_seconds >= 30:
              raise SystemExit(f"patched teardown took {patched_seconds:.3f}s")

          if status == 0:
              baseline = json.loads((evidence / "teardown-baseline.json").read_text())
              baseline_seconds = baseline["teardown_seconds"]
              if baseline_seconds < max(2.0, patched_seconds * 5.0):
                  raise SystemExit(
                      f"teardown speedup is not decisive: "
                      f"baseline={baseline_seconds:.3f}s patched={patched_seconds:.3f}s"
                  )
          elif status != 124:
              raise SystemExit(f"unexpected baseline status {status}")
          PY

          sudo chown -R "$USER:$USER" "$evidence"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cycles-hydra-issues30-32-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/evidence/
