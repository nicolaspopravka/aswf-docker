name: Validate Cycles USD 26.08 build fixes
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cycles-issue50-${{ github.ref }}
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      BASE_IMAGE: ghcr.io/nicolaspopravka/usd-render-benchmark@sha256:1511142ab48fba13ed379cb6230aaa97508d00961dc6dc44718ce4d8679f4793
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Prepare runner and pinned sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          lscpu | tee "$RUNNER_TEMP/evidence/host-cpu.txt"
          grep -qw rdtscp /proc/cpuinfo
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
          git init "$RUNNER_TEMP/cycles"
          git -C "$RUNNER_TEMP/cycles" fetch --depth=1 https://projects.blender.org/blender/cycles.git a456b761034dda42c32eef9f4aae0fa5a5c9f604
          git -C "$RUNNER_TEMP/cycles" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/cycles" rev-parse HEAD)" = a456b761034dda42c32eef9f4aae0fa5a5c9f604
          git -C "$RUNNER_TEMP/cycles" apply "$GITHUB_WORKSPACE/ci-cycles/issue50/candidate.patch"
          git -C "$RUNNER_TEMP/cycles" apply "$GITHUB_WORKSPACE/ci-cycles/issue50/plugin-api.patch"
          git -C "$RUNNER_TEMP/cycles" diff --check
          git -C "$RUNNER_TEMP/cycles" diff > "$RUNNER_TEMP/evidence/applied.patch"
          git init "$RUNNER_TEMP/openvdb"
          git -C "$RUNNER_TEMP/openvdb" fetch --depth=1 https://github.com/AcademySoftwareFoundation/openvdb.git 7c03e1f084873cd1b3422c7ff7aec6ee681b3b38
          git -C "$RUNNER_TEMP/openvdb" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/openvdb" rev-parse HEAD > "$RUNNER_TEMP/evidence/openvdb-ref.txt"
          sha256sum ci-cycles/issue50/* > "$RUNNER_TEMP/evidence/input-sha256.txt"
      - name: Build and render
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$BASE_IMAGE"
          docker image inspect "$BASE_IMAGE" > "$RUNNER_TEMP/evidence/image-inspect.json"
          docker run --name issue50 --entrypoint /bin/bash \
            -v "$RUNNER_TEMP/cycles:/cycles:ro" \
            -v "$RUNNER_TEMP/openvdb/cmake:/modules:ro" \
            -v "$GITHUB_WORKSPACE/ci-cycles/issue50:/evidence:ro" \
            -v "$RUNNER_TEMP/evidence:/out" \
            "$BASE_IMAGE" -lc 'bash /evidence/run-ci.sh' \
            2>&1 | tee "$RUNNER_TEMP/evidence/run.log"
      - name: Check image content
        shell: bash
        run: |
          set -euo pipefail
          python3 ci-cycles/check_png_variation.py "$RUNNER_TEMP/evidence/mesh.png" --expected-width 64 \
            | tee "$RUNNER_TEMP/evidence/image-check.txt"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cycles-issue50-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30
