name: Validate MoonRay GH 26 Fix

on: workflow_dispatch

permissions:
  contents: read
  packages: write

concurrency:
  group: openmoonray-hydra-${{ github.ref }}
  cancel-in-progress: false

env:
  BASE_IMAGE: aswf/ci-moonray:2025.7@sha256:0a6fd225c6a58b673d980c5d8503bb8a35a122006b9274428911374a3bc5dead
  MOONRAY_TAG: v2026.29.1
  MOONRAY_COMMIT: d96c6e30a8c280d4b5eb3bafa5e54efc445d7ea8
  MOONRAY_SDR_REPOSITORY: https://github.com/nicolaspopravka/moonray_sdr_plugins.git
  MOONRAY_SDR_COMMIT: 5f76b3b183a326470a09fdaeecc966b867c1c1f0
  IMAGE_REPOSITORY: ghcr.io/nicolaspopravka/openmoonray-hydra
  VALIDATION_IMAGE: openmoonray-hydra-validation:${{ github.run_id }}

jobs:
  build_candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      image: ${{ steps.candidate_digest.outputs.image }}

    steps:
      - name: Check out ASWF Docker fork
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Free runner disk space
        run: |
          set -euxo pipefail
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /usr/local/julia* \
            /usr/lib/jvm
          sudo apt-get clean
          docker system prune -af
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR for candidate storage
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Select candidate storage tag
        id: candidate_tag
        run: |
          set -euo pipefail
          readonly image="${IMAGE_REPOSITORY}:candidate-${GITHUB_SHA}"
          printf 'image=%s\n' "${image}" | tee -a "${GITHUB_OUTPUT}"

      - name: Build and store candidate image
        env:
          BUILDKIT_STEP_LOG_MAX_SIZE: 52428800
        run: |
          set -euxo pipefail
          docker buildx build \
            --file ci-moonray-hydra/Dockerfile \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "MOONRAY_TAG=${MOONRAY_TAG}" \
            --build-arg "MOONRAY_COMMIT=${MOONRAY_COMMIT}" \
            --build-arg "MOONRAY_SDR_REPOSITORY=${MOONRAY_SDR_REPOSITORY}" \
            --build-arg "MOONRAY_SDR_COMMIT=${MOONRAY_SDR_COMMIT}" \
            --build-arg "BUILD_REVISION=${GITHUB_SHA}" \
            --build-arg "BUILD_JOBS=4" \
            --cache-from type=gha,scope=openmoonray-hydra-2026-29-1 \
            --cache-to type=gha,mode=max,scope=openmoonray-hydra-2026-29-1 \
            --push \
            --tag "${{ steps.candidate_tag.outputs.image }}" \
            .

      - name: Resolve immutable candidate digest
        id: candidate_digest
        run: |
          set -euo pipefail
          readonly digest="$(
            docker buildx imagetools inspect \
              "${{ steps.candidate_tag.outputs.image }}" \
              | awk '/^Digest:/ { print $2; exit }'
          )"
          test -n "${digest}"
          test "${digest#sha256:}" != "${digest}"
          printf 'image=%s@%s\n' "${IMAGE_REPOSITORY}" "${digest}" \
            | tee -a "${GITHUB_OUTPUT}"

  validate:
    needs: build_candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CANDIDATE_IMAGE: ${{ needs.build_candidate.outputs.image }}

    steps:
      - name: Check out validation scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Free runner disk space
        run: |
          set -euxo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/local/.ghcup \
            /usr/local/aws-cli \
            /usr/local/aws-sam-cli \
            /usr/local/julia* \
            /usr/lib/jvm
          sudo apt-get clean
          docker system prune -af

      - name: Log in to GHCR for candidate access
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull exact candidate image
        run: |
          set -euxo pipefail
          docker pull "${CANDIDATE_IMAGE}"
          docker tag "${CANDIDATE_IMAGE}" "${VALIDATION_IMAGE}"
          docker image inspect "${VALIDATION_IMAGE}" \
            > "${RUNNER_TEMP}/openmoonray-image-inspect.json"

      - name: Run required installation and rendering gates
        run: |
          set -euxo pipefail
          mkdir -p "${RUNNER_TEMP}/moonray-evidence"
          docker run --rm \
            --security-opt seccomp=unconfined \
            --shm-size=2g \
            --volume "${PWD}/ci-moonray-hydra:/validation:ro" \
            --volume "${RUNNER_TEMP}/moonray-evidence:/evidence" \
            "${VALIDATION_IMAGE}" \
            /validation/validate.sh

      - name: Upload test scenes, renders, and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openmoonray-hydra-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/openmoonray-image-inspect.json
            ${{ runner.temp }}/moonray-evidence
          if-no-files-found: warn
          retention-days: 30
