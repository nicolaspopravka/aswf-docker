# Build hdMoonray Hydra render delegate from openmoonray-3.6.0.1
# on aswf/ci-moonray:2026 and push derived image to GHCR.
#
# Derived image: ghcr.io/nicolaspopravka/ci-moonray-cy2026-hdMoonray
# Pattern: targeted-openusd-materialx-images.yml in this repo

name: Build MoonRay Hydra Delegate

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ci-moonray-cy2026-hdMoonray
  BASE_IMAGE: aswf/ci-moonray:2026
  MOONRAY_TAG: openmoonray-3.6.0.1
  MOONRAY_ROOT: /opt/MoonRay

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/local/julia* /usr/lib/jvm
          sudo apt-get clean
          docker system prune -af

      - name: Pull base image
        run: docker pull ${{ env.BASE_IMAGE }}

      - name: Build hdMoonray inside base image
        run: |
          set -eux
          mkdir -p "$RUNNER_TEMP/moonray-build/out"
          cat > "$RUNNER_TEMP/moonray-build/build.sh" << 'BUILDSCRIPT'
          set -ex

          # System packages needed beyond what ci-moonray:2026 provides
          dnf install -y cppunit-devel log4cplus-devel git

          # Create upstream directory layout
          mkdir -p $MOONRAY_ROOT/{installs,build,build-deps,source}

          # Step 2: Clone openmoonray
          git clone --recursive --branch ${MOONRAY_TAG} \
              https://github.com/OpenMoonRay/openmoonray.git \
              $MOONRAY_ROOT/source/openmoonray

          # Step 3: Install OS packages (already satisfied by ci-moonray:2026 base)
          # Step 4: Build internal deps from source
          cd $MOONRAY_ROOT/build-deps
          # NOTE: Upstream assumes CMake 3.23.1; ci-moonray:2026 has CMake 4
          # which rejects cmake_minimum_required(VERSION < 3.5). Patch Embree.
          sed -i 's/ExternalProject_Add(embree/ExternalProject_Add(embree\n    CMAKE_CACHE_ARGS -DCMAKE_POLICY_VERSION_MINIMUM:STRING=3.5/' \
              $MOONRAY_ROOT/source/openmoonray/building/Rocky9/CMakeLists.txt
          # Skip OCIO, OIIO (ci-moonray:2026 has them at /usr/local);
          # upstream versions fail to build on CMake 4 / lack deps.
          sed -i '/^ExternalProject_Add(OpenColorIO$/,/^set(CHAIN OpenColorIO)$/s/^/#/' \
              $MOONRAY_ROOT/source/openmoonray/building/Rocky9/CMakeLists.txt
          sed -i '/^ExternalProject_Add(OpenImageIO$/,/^set(CHAIN OpenImageIO)$/s/^/#/' \
              $MOONRAY_ROOT/source/openmoonray/building/Rocky9/CMakeLists.txt
          # Skip USD build (ci-moonray has USD 26.03 at /usr/local)
          cmake $MOONRAY_ROOT/source/openmoonray/building/Rocky9 \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DNO_USD=1
          cmake --build . -- -j $(nproc)

          # Step 5: Build MoonRay (incl. hdMoonray) per upstream rocky9-release preset
          cd $MOONRAY_ROOT/source/openmoonray
          cmake --preset rocky9-release
          cmake --build --preset rocky9-release -- -j $(nproc)

          # Step 6: Generate shader JSON (required at runtime)
          $MOONRAY_ROOT/installs/openmoonray/bin/rdl2_json_exporter \
              --out $MOONRAY_ROOT/installs/openmoonray/shader_json/ --sparse

          # Verify the delegate
          ls -la $MOONRAY_ROOT/installs/openmoonray/plugin/pxr/

          # Copy installed output to volume for Dockerfile layer
          # Include both the MoonRay install and dep libraries for runtime
          mkdir -p /out/opt/MoonRay
          cp -a $MOONRAY_ROOT/installs /out/opt/MoonRay/installs
          BUILDSCRIPT

          docker run --rm \
            -e MOONRAY_TAG \
            -e MOONRAY_ROOT \
            -v "$RUNNER_TEMP/moonray-build:/build:ro" \
            -v "$RUNNER_TEMP/moonray-build/out:/out" \
            ${{ env.BASE_IMAGE }} \
            bash /build/build.sh

      - name: Create derived Docker image
        env:
          TARGET_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          set -eux
          {
            echo "FROM ${{ env.BASE_IMAGE }}"
            echo "COPY out/opt/MoonRay /opt/MoonRay"
            echo "ENV RDL2_DSO_PATH=/opt/MoonRay/installs/openmoonray/rdl2dso.proxy:/opt/MoonRay/installs/openmoonray/rdl2dso"
            echo "ENV MOONRAY_CLASS_PATH=/opt/MoonRay/installs/openmoonray/shader_json"
            echo "ENV ARRAS_SESSION_PATH=/opt/MoonRay/installs/openmoonray/sessions"
            echo "ENV PATH=/opt/MoonRay/installs/openmoonray/bin:\${PATH}"
            echo "ENV PXR_PLUGINPATH_NAME=/opt/MoonRay/installs/openmoonray/plugin/pxr:\${PXR_PLUGINPATH_NAME}"
            echo "ENV LD_LIBRARY_PATH=/opt/MoonRay/installs/lib:\${LD_LIBRARY_PATH}"
          } > "$RUNNER_TEMP/moonray-build/Dockerfile"
          docker build -t "$TARGET_IMAGE" "$RUNNER_TEMP/moonray-build"

      - name: Push to GHCR
        env:
          TARGET_IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} \
            -u ${{ github.actor }} --password-stdin
          docker tag "$TARGET_IMAGE" \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          docker push "$TARGET_IMAGE"
          docker push ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          docker buildx imagetools inspect "$TARGET_IMAGE"
