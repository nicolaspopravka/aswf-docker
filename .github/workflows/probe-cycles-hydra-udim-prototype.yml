name: Probe Cycles Hydra UDIM prototype

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cycles-hydra-udim-prototype-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPENDENCY_IMAGE: ghcr.io/nicolaspopravka/ci-cycles@sha256:fdd920a0a4e5d0fca76f0ce7ac64edff4012b5be4784ccb9ea683f4d4a5edb16
  CYCLES_REVISION: 8424ed531b0d0b56667418d4a8d09452957b7904
  CYCLES_LIB_REVISION: 30d9f881c4b62c52323fd11637eeea56d460e35c
  OPENUSD_REVISION: 2095fafafd033fa23386d7ec6d58c7cc33974518

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            apply_patch: "0"
            expected_source_sha256: 1aaf66bcba1baa190c5fecfa8ab3196013c6da715dfb461b9b9bed9fd8e8af89
          - variant: candidate
            apply_patch: "1"
            expected_source_sha256: 85bb497cfd340994ee1cce7b214c41b3dae12a4a8bb353e63568c951e6921768

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate fixed inputs
        run: |
          set -euxo pipefail
          [[ "$DEPENDENCY_IMAGE" == *@sha256:* ]]
          [[ "$CYCLES_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CYCLES_LIB_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPENUSD_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "${{ matrix.apply_patch }}" =~ ^[01]$ ]]
          test -f ci-cycles/Dockerfile.hydra-udim-prototype
          test -f ci-cycles/build_cycles_hydra_udim_prototype.sh
          test -f ci-cycles/hydra-udim-prototype/cycles-hydra-udim.patch
          test -f ci-cycles/hydra-udim-prototype/udim.usda
          git diff --check
          sha256sum ci-cycles/hydra-udim-prototype/*

      - name: Reclaim runner disk
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/local/julia* \
            /usr/lib/jvm
          sudo apt-get clean
          docker system prune -af
          df -h /

      - name: Build exact Cycles delegate
        run: |
          set -euxo pipefail
          docker build --progress=plain \
            --file ci-cycles/Dockerfile.hydra-udim-prototype \
            --tag "cycles-hydra-udim:${{ matrix.variant }}-$GITHUB_SHA" \
            --build-arg DEPENDENCY_IMAGE="$DEPENDENCY_IMAGE" \
            --build-arg WORKFLOW_REVISION="$GITHUB_SHA" \
            --build-arg CYCLES_REVISION="$CYCLES_REVISION" \
            --build-arg CYCLES_LIB_REVISION="$CYCLES_LIB_REVISION" \
            --build-arg OPENUSD_REVISION="$OPENUSD_REVISION" \
            --build-arg APPLY_UDIM_PATCH="${{ matrix.apply_patch }}" \
            . 2>&1 | tee "${{ runner.temp }}/build-${{ matrix.variant }}.log"

      - name: Validate delegate and source state
        run: |
          set -euxo pipefail
          evidence="${{ runner.temp }}/evidence-${{ matrix.variant }}"
          mkdir -p "$evidence"
          docker image inspect "cycles-hydra-udim:${{ matrix.variant }}-$GITHUB_SHA" \
            > "$evidence/image-inspect.json"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/ci-cycles/hydra-udim-prototype:/expected:ro" \
            --volume "$evidence:/out" \
            "cycles-hydra-udim:${{ matrix.variant }}-$GITHUB_SHA" bash -c '
              set -euxo pipefail
              test -f /opt/cycles/hydra/hdCycles.so
              grep -Fq "${{ matrix.expected_source_sha256 }}" \
                /opt/cycles-build-evidence/material.cpp.sha256
              if [[ "${{ matrix.apply_patch }}" == "1" ]]; then
                test -s /opt/cycles-build-evidence/cycles-source.patch
              else
                test ! -s /opt/cycles-build-evidence/cycles-source.patch
              fi
              python3 -c "from pxr import UsdImagingGL; names = [UsdImagingGL.Engine.GetRendererDisplayName(p) for p in UsdImagingGL.Engine.GetRendererPlugins()]; print(names); assert \"Cycles\" in names"
              ldd -r /opt/cycles/hydra/hdCycles.so | tee /out/hdCycles-ldd.txt
              ! grep -Eq "not found|undefined symbol" /out/hdCycles-ldd.txt
              cp -a /opt/cycles-build-evidence/. /out/
            '
          sudo chown -R "$USER:$USER" "$evidence"

      - name: Run texture fixtures
        run: |
          set -euxo pipefail
          evidence="${{ runner.temp }}/evidence-${{ matrix.variant }}"
          fixture="$GITHUB_WORKSPACE/ci-cycles/hydra-udim-prototype"
          sed 's/tile.<UDIM>.ppm/single.ppm/' "$fixture/udim.usda" > "$evidence/single.usda"
          sed 's/tile.<UDIM>.ppm/missing.<UDIM>.ppm/' "$fixture/udim.usda" \
            > "$evidence/missing-udim.usda"
          cp "$fixture/single.ppm" "$evidence/single.ppm"

          docker run --rm \
            --volume "$fixture:/fixtures:ro" \
            --volume "$evidence:/out" \
            "cycles-hydra-udim:${{ matrix.variant }}-$GITHUB_SHA" bash -c '
              set -euxo pipefail
              export CYCLES_DEVICE=CPU
              usdrecord --disableGpu --renderer Cycles --camera /World/Camera --imageWidth 256 \
                /fixtures/udim.usda /out/udim.png > /out/udim.log 2>&1
              usdrecord --disableGpu --renderer Cycles --camera /World/Camera --imageWidth 128 \
                /out/single.usda /out/single.png > /out/single.log 2>&1
              set +e
              usdrecord --disableGpu --renderer Cycles --camera /World/Camera --imageWidth 128 \
                /out/missing-udim.usda /out/missing-udim.png \
                > /out/missing-udim.log 2>&1
              printf "%s\n" "$?" > /out/missing-udim.status
            '
          sudo chown -R "$USER:$USER" "$evidence"

          grep -Fq 'Renderer plugin: HdCyclesPlugin' "$evidence/udim.log"
          ! grep -Eq 'does not exist|Failed to load|Recording aborted' "$evidence/single.log"
          test "$(cat "$evidence/missing-udim.status")" != 139
          test -s "$evidence/missing-udim.log"
          python3 ci-cycles/hydra-udim-prototype/check_udim_png.py \
            "$evidence/single.png" --mode cyan

          if [[ "${{ matrix.variant }}" == "baseline" ]]; then
            grep -Fq 'tile.<UDIM>.ppm' "$evidence/udim.log"
            if python3 ci-cycles/hydra-udim-prototype/check_udim_png.py \
              "$evidence/udim.png" --mode udim; then
              echo "baseline unexpectedly rendered both tiles" >&2
              exit 1
            fi
          else
            ! grep -Fq '<UDIM>' "$evidence/udim.log"
            python3 ci-cycles/hydra-udim-prototype/check_udim_png.py \
              "$evidence/udim.png" --mode udim
          fi
          file "$evidence/"*.png
          sha256sum "$evidence/"*.png > "$evidence/image-sha256.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cycles-hydra-udim-${{ matrix.variant }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/build-${{ matrix.variant }}.log
            ${{ runner.temp }}/evidence-${{ matrix.variant }}/
